[package]
name = "capsule-sdk"
version.workspace = true
edition.workspace = true

[lib]
# `lib` (rlib) keeps the rest of the workspace linking capsule-sdk unchanged.
# `cdylib` is the Android `.so` and `staticlib` the iOS/macOS input for the uniffi
# bindings (see the `ffi` feature); library-mode `uniffi-bindgen` reads its metadata
# from the compiled cdylib. Cargo cannot gate crate-type by feature, so host builds
# also emit these — an accepted, cheap cost, mirroring `capsule-core`.
crate-type = ["lib", "cdylib", "staticlib"]

# Generates the Kotlin/Swift bindings from the compiled cdylib (library mode). Built
# only with `--features ffi-bindgen`, so the SDK's network deps never enter the
# generator's compile in a way the mobile artifact would carry.
[[bin]]
name = "uniffi-bindgen"
required-features = ["ffi-bindgen"]

[features]
# `ffi` exposes the uniffi-annotated surface (FfiCapsuleClient / FfiSession over the
# user-flow primitives — login → upload → status → sync). Off by default so the
# workspace/CLI/server builds never compile it. Async-capable: the exported flows are
# `async fn` driven on a tokio runtime (uniffi's `tokio` feature). `ffi-bindgen`
# additionally pulls uniffi's CLI so the `uniffi-bindgen` bin can emit the bindings.
ffi = ["dep:uniffi"]
ffi-bindgen = ["ffi", "uniffi/cli"]

[dependencies]
# capsule-i18n gives the SDK the canonical `error.*` code constants it switches
# on (clients localize codes, never bare HTTP statuses — see CLAUDE.md).
capsule-i18n = { path = "../capsule-i18n" }
# The verify-before-destroy gate (S-D4) reuses the offline data plane's pure predicate
# (`library::release_is_safe`), the `StorageVerdict` type, and custody-receipt verification
# (`library::verify_receipt` under the pinned hybrid attestation key) — all `capsule-core`
# crypto/library surface, so the SDK does not re-implement signature verification.
capsule-core = { path = "../capsule-core" }
# base64 decodes the server's `receipt_cbor` (STANDARD) and the well-known attestation public
# keys before handing them to capsule-core for verification.
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
secrecy = { workspace = true }
tracing = { workspace = true }
# SHA-256 lowercase-hex per-chunk checksum (`X-Capsule-Checksum`); byte-identical
# to the server's `capsule_core::utils::hash::hash_bytes`, so no capsule-core dep.
sha2 = { workspace = true }
hex = { workspace = true }

# Single-flight refresh coordination (Mutex / RwLock / Notify) plus `time` for the
# shared retry engine's backoff sleeper (`net::TokioSleeper`). The async runtime
# itself is supplied by the caller; the SDK only needs these primitives here. `net` +
# `io-util` are the LAN-peering (S-E3) channel's TCP socket and framed async read/write.
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }

uuid = { version = "1.23.3", features = ["v7", "serde"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
    "multipart",
] }

# ── LAN peering (S-E3) ───────────────────────────────────────────────────────
# The peering channel is mutually-authenticated TLS 1.3 with no CA (the device keys
# are the trust anchor, checked at the application layer). rustls is the sanctioned
# TLS stack (Dependencies doc — "LAN-peering mutual TLS"); tokio-rustls is its async
# adapter and rcgen mints the per-connection self-signed leaf the handshake presents.
# The `ring` provider is pinned across all three so the peering stack never depends on
# an ambiguous process-default CryptoProvider (reqwest's rustls-tls uses aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }

# The key-free sync feed is gRPC (`capsule.sync.v1.SyncService`); the SDK compiles
# the same in-tree proto (build.rs) into a client-only stub. rustls only — the
# tonic transport's TLS rides `tls-ring` when a caller dials `https`.
tonic = { workspace = true, features = ["transport"] }
tonic-prost = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }

# ── FFI (optional; `ffi` feature) ──────────────────────────────────────────
# uniffi proc-macro bindings for Swift/Kotlin/Linux over the SDK's user-flow
# primitives. Single pinned uniffi (0.31.1 — the S-F1 consolidation; do not add a
# second). The `tokio` feature lets `#[uniffi::export(async_runtime = "tokio")]`
# drive the async login/upload/sync flows on the tokio runtime reqwest/tonic need.
uniffi = { version = "0.31", features = ["tokio"], optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
# spargen (in-house) generates the typed REST client from the committed OpenAPI 3.1 schema
# at build time (slice `S-D8`); see `build.rs`. `default-features = false` drops its `cli`
# (clap) and the `uuid`/`time` `format`-mapping features — the current schema emits neither,
# and disabling them keeps the SDK's build graph minimal. spargen is a *build*-dependency
# only: its embedded runtime is emitted into the generated module, so spargen never appears
# in the SDK's runtime dependency tree.
spargen = { version = "0.1.0", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.23.3", features = ["v7"] }
serde_json = { workspace = true }
# The S-D18 envelope mapping is asserted against a manifest a real `capsule_core::Workspace`
# produced, so the push tests build a throwaway library on disk.
tempfile = "3"
