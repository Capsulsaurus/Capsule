# The bounded E2E surface (the case index is in `src/lib.rs`): the real `capsule-sdk`
# and the real `capsule-core` library driven over TCP against the real `capsule-server`
# composition root. A test crate rather than a `tests/` directory of one of those crates because
# the cases need all of them at once — case 1 alone needs the CLI's sync orchestration over its
# local database, which belongs in neither the server's nor the SDK's dev graph.
#
# Every dependency below is already in `Cargo.lock`; this crate adds no external crate.
[package]
name = "capsule-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "End-to-end cases over the real SDK, library and server composition root"

[lib]
name = "capsule_e2e"
path = "src/lib.rs"
doctest = false

[dependencies]
capsule-core = { path = "../capsule-core" }
capsule-library = { path = "../capsule-library" }
capsule-sdk = { path = "../capsule-sdk" }
# The lib target only: `boot::assemble` is the composition root `serve --memory` runs.
capsule-server = { path = "../capsule-server" }
# `server` binds the assembled service to an ephemeral port; the workspace pin carries only the
# OpenAPI feature, and the server crate itself has `server` as a dev-dependency feature.
kynos = { workspace = true, features = ["server"] }
base64 = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
# Case 4's TLS front (`src/federation.rs`): a private CA and a leaf for a peer's host name
# (`rcgen`), terminated by `tokio-rustls` over the `ring` provider. The versions and features
# `capsule-server`'s mock identity provider pins, so nothing new enters the lock file.
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
# The same `capsule-server`, with `test-egress` on: case 4's pull dials `https://{peer}/`, and the
# seam routes that host to the case's TLS front and trusts its private CA. A dev-dependency for
# the reason `capsule-library`'s `test-support` is one below: resolver 3 then keeps the feature
# out of every build that is not a test target.
capsule-server = { path = "../capsule-server", features = ["test-egress"] }
# The same `capsule-library` (and through it `capsule-core`), with `test-support` on: case 6
# exports its backup at an explicit fast Argon2id cost, and the entry point that takes one is
# compiled out of a production build on purpose (a weak cost is a brute-forceable artifact).
# Declared here rather than beside the normal dependency above so resolver 3 keeps the feature
# out of `cargo build --workspace` — it is on only when a test target is being built, which is
# the only thing this crate has.
capsule-library = { path = "../capsule-library", features = ["test-support"] }
# Case 1's client leg is the CLI's own `remote::sync` / `remote::list` over its SQLite store
# (`capsule_cli::db::LocalDb`, migrated on open).
capsule-cli = { path = "../capsule-cli" }
# Case 14's viewer leg opens a share link through the entry points the web viewer calls, run
# natively — the same use `capsule-server/tests/share.rs` makes of it in-process.
capsule-wasm = { path = "../capsule-wasm" }
# The golden wire fixtures (`tests/golden_wire.rs`) record and replay raw HTTP exchanges: a
# fixture is the bytes on the wire, so it must be sent as recorded rather than through a typed
# client that would re-serialize it, and the unauthenticated half (register, login, the
# well-known documents) has no SDK session to borrow a client from.
reqwest = { workspace = true }
# The golden records are canonical CBOR, committed as hex.
hex = { workspace = true }
# The backup drill (`tests/backup_restore_drill.rs`) runs the durable profile: a Postgres per
# host, behind `CAPSULE_TEST_POSTGRES=1` like the server's own container tier, and the migration
# `capsule-server-migration up` applies before `serve`.
# The kill-anywhere suite (`tests/kill_anywhere.rs`) needs the same, because a server that is
# SIGKILLed and restarted keeps nothing in the `--memory` profile.
capsule-server-migration = { path = "../capsule-server/migration" }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
