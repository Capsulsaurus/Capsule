# Capsule monorepo dev tooling + task runner (mise).
#
# Pinned so local and CI install identical versions. From the repo root:
#   mise install        # installs the tools below
#   mise tasks          # lists every task (plain = auto-fix, -check = verify-only)
#   mise run check-rust  # run a task
#
# Scope: the shared toolchain plus the cross-platform task graph (formerly the
# justfile). Language toolchains stay where they belong — Rust in
# /rust-toolchain.toml, the Apple client's Swift tools in capsule-swift/mise.toml
# (mise layers child configs on top of this one).

[tools]
# hk: git-hook runner (replaces lefthook). The version here MUST match the
# `amends` URL in hk.pkl, or pkl reports a schema mismatch. Bump both together.
hk = "1.48.0"
# convco / cargo-nextest aren't in the mise registry by a short name. The `cargo`
# backend fetches a prebuilt binary via cargo-binstall when possible and otherwise
# builds from source, working uniformly on every OS in CI and locally.
"cargo:convco" = "0.6.4"
"cargo:cargo-nextest" = "0.9"
# wasm-bindgen CLI post-processes the `capsule-wasm` cdylib into the browser JS glue the web
# share viewer + the `share-open` bun KAT load (slice S-E1, `build-wasm`). Pinned to EXACTLY the
# `wasm-bindgen` crate version in `capsule-wasm/Cargo.toml` — the two must match or wasm-bindgen
# aborts. Bump both together. Chosen over wasm-pack so the gate stays fully offline (no runtime
# fetch of a version-matched wasm-bindgen) once the toolchain is installed.
"cargo:wasm-bindgen-cli" = "0.2.100"
# cargo-deny enforces the dependency-licence allowlist in deny.toml (the policy it
# implements is capsule-docs/.../design/licensing.md). Only `check licenses` is wired
# up: the advisories check needs a network fetch of the RustSec database, which would
# make the gate non-deterministic and break the offline build.
"cargo:cargo-deny" = "0.19.8"

[env]
# Curated clippy lint set, applied `--workspace` so every crate gets identical rules
# (no per-crate `[lints]` opt-in/opt-out). Levels live here; thresholds in clippy.toml.
# Enables `pedantic` then allows the doc/cast/ergonomics noise; keeps the high-value
# checks (unwrap_used denied, mechanical cleanups) plus a couple of rustc lints.
# Referenced unquoted (`-- $CLIPPY_FLAGS`) so the shell word-splits it into flags.
CLIPPY_FLAGS = "-W clippy::pedantic -W unreachable_pub -D warnings -A clippy::must_use_candidate -A clippy::missing_errors_doc -A clippy::missing_panics_doc -A clippy::doc_markdown -A clippy::cast_possible_truncation -A clippy::cast_possible_wrap -A clippy::cast_sign_loss -A clippy::cast_lossless -A clippy::cast_precision_loss -A clippy::module_name_repetitions -A clippy::similar_names -A clippy::too_many_lines -A clippy::struct_excessive_bools -A clippy::unused_self -A clippy::return_self_not_must_use -A clippy::needless_pass_by_value -A clippy::trivially_copy_pass_by_ref -A clippy::unnecessary_wraps -A clippy::wildcard_imports -A clippy::default_trait_access -A clippy::upper_case_acronyms -A clippy::unused_async -A clippy::unused_async_trait_impl -A clippy::decimal_bitwise_operands -A clippy::wrong_self_convention -A clippy::enum_variant_names -A clippy::struct_field_names -A clippy::option_option -A clippy::used_underscore_binding -A clippy::ref_option -A clippy::items_after_statements -D clippy::unwrap_used -D clippy::dbg_macro"

# ── Aggregates ───────────────────────────────────────────────────────────────
# Cross-toolchain fan-outs use `depends` (mise runs them in parallel). The only
# cargo task inside each is the Rust one, so there's no `target/` lock contention.

[tasks.format]
description = "Auto-format every toolchain"
depends = ["format-rust", "format-web", "format-docs", "format-kotlin", "format-vision", "format-swift"]

[tasks.format-check]
description = "Verify formatting, every toolchain"
depends = ["format-check-rust", "format-check-web", "format-check-docs", "format-check-kotlin", "format-check-vision", "format-check-swift"]

[tasks.lint]
description = "Auto-fix lints, every toolchain"
depends = ["lint-rust", "lint-web", "lint-docs", "lint-kotlin", "lint-vision", "lint-swift", "lint-md"]

[tasks.lint-check]
description = "Verify lints, every toolchain"
depends = ["lint-check-rust", "lint-check-web", "lint-check-docs", "lint-check-kotlin", "lint-check-vision", "lint-check-swift", "lint-check-md", "check-docs-truth"]

[tasks.test]
description = "Run tests (rust + web + kotlin + swift + docs)"
depends = ["test-rust", "test-web", "test-kotlin", "test-swift", "test-docs"]

[tasks.test-coverage]
description = "Coverage report (rust)"
depends = ["test-coverage-rust"]

[tasks.build]
description = "Build every toolchain"
depends = ["build-rust", "build-web", "build-docs", "build-kotlin", "build-swift"]

# CI gate. Sequential: format-check and lint-check both drive cargo, so running
# them (and the test build) in parallel would thrash the single `target/` lock.
[tasks.check]
description = "Full CI gate (format-check + lint-check + test)"
run = ["mise run format-check", "mise run lint-check", "mise run test"]

# ── Per-toolchain CI entrypoints ─────────────────────────────────────────────
# Each maps 1:1 to a CI job so the workflow stays consistent with this file.

# Sequential for the same target-lock reason as `check`: every step here touches cargo.
[tasks.check-rust]
description = "Rust CI gate"
run = [
  "mise run format-check-rust",
  "mise run lint-check-rust",
  "mise run doc-check-rust",
  "mise run i18n-check",
  "mise run i18n-guard",
  "mise run openapi-check-kynos",
  "mise run architecture-check",
  "mise run license-check",
  "mise run translate-readme-check",
  "mise run build-rust",
  "mise run build-check-wasm",
  "mise run build-ffi",
  "mise run lint-check-ffi",
  "mise run gen-bindings",
  "mise run verify-examples",
]

[tasks.check-web]
description = "Web CI gate"
depends = ["format-check-web", "lint-check-web", "test-web", "build-web"]

[tasks.check-docs]
description = "Docs CI gate"
depends = ["format-check-docs", "lint-check-docs", "test-docs", "build-docs"]

[tasks.check-vision]
description = "Vision CI gate"
depends = ["format-check-vision", "lint-check-vision"]

[tasks.check-kotlin]
description = "Kotlin CI gate"
depends = ["format-check-kotlin", "lint-check-kotlin"]

[tasks.check-md]
description = "Markdown CI gate"
depends = ["lint-check-md"]

# ── Rust ─────────────────────────────────────────────────────────────────────

[tasks.format-rust]
run = "cargo fmt"

[tasks.format-check-rust]
run = "cargo fmt --check"

[tasks.lint-rust]
run = "cargo clippy --workspace --fix --allow-dirty -- $CLIPPY_FLAGS"

[tasks.lint-check-rust]
run = "cargo clippy --workspace -- $CLIPPY_FLAGS"

# The rustdoc gate for the frozen crates (issue #399): a broken intra-doc link or an ambiguous
# one is an error, not a warning. Scoped to the four crates whose public API is frozen; the rest
# of the workspace is widened in a follow-up.
#
# `--document-private-items` is load-bearing, not thoroughness for its own sake. #399 turned 59
# submodules of `library`, `import`, `db`, `crypto::keys`, `sidecar` and `domain` into
# `pub(crate) mod`. A public-only `cargo doc` stops reading their `//!` headers and their items'
# docs the moment they stop being public — so the gate would have gone blind to exactly the
# modules the same change touched, and 11 pre-existing broken links in them would have been
# hidden rather than fixed. With the flag every item in these four crates is linted.
#
# `--no-deps` so a dependency's own doc warnings cannot fail our build.
[tasks.doc-check-rust]
description = "Rustdoc gate for the frozen crates (intra-doc links, over all items)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --document-private-items -p capsule-core -p capsule-core-ffi -p capsule-wasm -p capsule-i18n"

# nextest: cross-binary parallel scheduling + process-per-test isolation. Two
# invocations — the workspace (default features), then capsule-core's FFI surface.
# nextest does not run doctests; the workspace has none (if you add one, also add a
# `cargo test --doc` step). CI selects the `ci` profile via NEXTEST_PROFILE=ci.
[tasks.test-rust]
run = [
  "cargo nextest run --workspace",
  "cargo nextest run -p capsule-core --features ffi",
  "cargo nextest run -p capsule-sdk --features ffi",
]

[tasks.test-coverage-rust]
run = "cargo llvm-cov nextest --workspace --fail-under-lines 0"

[tasks.build-rust]
run = "cargo build --workspace"

# The wasm32 sealing build, type-checked. `build-rust` compiles the host triple only, so nothing
# in any gate ever built `capsule-core --no-default-features` for wasm32 — which is how an ungated
# `pub mod albumstore` (a filesystem-backed store, added by S-A10) silently broke the browser
# sealing surface and, through `capsule-wasm`, `build-wasm` -> `build-web` -> `check-web`. `cargo
# check` rather than `build-wasm` because this belongs in the Rust gate and must not need
# wasm-bindgen-cli; `build-wasm` still produces the actual artifact.
[tasks.build-check-wasm]
description = "Type-check the wasm32 sealing surface (capsule-core no-default-features + capsule-wasm)"
run = [
  "cargo check -p capsule-core --target wasm32-unknown-unknown --no-default-features",
  "cargo check -p capsule-wasm --target wasm32-unknown-unknown",
]

# Boundary gate for the retired architecture (Salvo, GraphQL/gRPC, Progenitor, the legacy
# media stack). It rejects implicit workspace packages, retired dependencies, buildable
# manifests under `legacy-review/`, and stale component references.
#
# **In `check-rust` since `S-C59`.** It was adopted as a report first, deliberately: the Salvo
# server and the in-repo media stack were live and stayed that way until the Kynos rebuild reached
# parity, because `legacy-review/`'s own charter is that code leaves quarantine only once its
# replacement contract and tests exist — and retiring first would have left the tree with no
# server, no CLI network commands and no end-to-end test for the whole rebuild. Its output was the
# worklist: 63 violations at adoption, 0 now. It is a gate rather than a report from here, so the
# boundary cannot quietly move back.
[tasks.architecture-check]
description = "Verify active-workspace and retired-component boundaries"
run = "cargo run -q -p xtask -- architecture-check"

# Compile the canonical locales/ catalogs into each platform's native i18n format
# (Rust bundle, web JSON, Android strings.xml, iOS .xcstrings). See xtask/src/i18n.rs.
[tasks.i18n]
description = "Compile locales/ into per-platform i18n files"
run = "cargo run -q -p xtask -- i18n"

# Verify the generated i18n files are in sync with locales/ (CI drift gate).
[tasks.i18n-check]
description = "Verify generated i18n is in sync with locales/"
run = "cargo run -q -p xtask -- i18n --check"

# S-I1 regression gate: fail on any hardcoded user-facing string literal in the
# web (JSX), SwiftUI, or Compose surfaces that isn't a catalog key/allowlisted. This
# is the ONE gate for all three surfaces — the Kotlin half runs here (not via Gradle,
# which the migration cannot depend on) so it stays locally verifiable.
[tasks.i18n-guard]
description = "Fail on hardcoded user-facing literals (web/swift/compose)"
run = "cargo run -q -p xtask -- i18n-guard"

# Dependency-licence gate. Fails on any crate whose licence is not allowlisted in
# deny.toml -- which denies GPL-*/LGPL-*/AGPL-* by omission, so a copyleft crate can
# never reach a statically-linked release binary and quietly forfeit app-store
# distribution. `--all-features` so wasm/UEFI-only crates are covered too.
[tasks.license-check]
description = "Verify every dependency licence is allowlisted in deny.toml"
run = "cargo deny --all-features check licenses"

# Dump the Kynos OpenAPI 3.2 document to the committed capsule-server/openapi.json that spargen
# generates the typed REST client from (slices `S-C34`, `S-D28`). The dump is state-free — no
# database, Valkey, or key material, because the router takes `App` only as a type parameter — so
# it is deterministic and runs anywhere. Re-run and commit after any endpoint or model change.
#
# There were two documents and two drift guards while the rebuild ran, so a client had somewhere
# to point at each stage. `S-C59` retired the Salvo one; this is now the contract, singular.
[tasks.openapi-kynos]
description = "Dump the Kynos OpenAPI 3.2 document to capsule-server/openapi.json"
run = "cargo run -q -p capsule-server -- gen-openapi"

[tasks.openapi-check-kynos]
description = "Verify the committed Kynos OpenAPI 3.2 document matches the server"
run = "cargo run -q -p capsule-server -- gen-openapi --check"

# ── Running a server locally ─────────────────────────────────────────────────
#
# `serve-deps` and `serve` are deliberately separate: a task that silently starts containers is
# a task that leaks them. Bring the services down with
# `podman compose -f capsule-server/compose.yaml down`.

[tasks.serve-deps]
description = "Start Postgres 18 + Valkey 9 for the server (podman compose)"
# `podman compose` shells out to the compose provider; `docker compose -f …` accepts the same
# file. The Valkey adapters (#403) read the Valkey service; the Postgres adapters (#402) are not
# written yet, so this is for their development and for dependabot to have a live file to track.
run = "podman compose -f capsule-server/compose.yaml up -d"

[tasks.serve]
description = "Run the Kynos server (needs the capsule-server/.env.example environment)"
# No environment is supplied on purpose. `serve` without `VALKEY_URL` and without `--memory`
# refuses to boot and names the variable — the refusal `capsule-server/src/store/mod.rs` has
# documented since `S-C29` — and with `VALKEY_URL` set it connects to Valkey and then refuses
# naming `DATABASE_URL` and #402 until the Postgres adapters land. Copy
# `capsule-server/.env.example` and export it, or use `serve-memory` below.
run = "cargo run -p capsule-server -- serve"

[tasks.serve-memory]
description = "Run the server on the in-memory adapters (development only)"
# A server you can point a client at: register, sign in, upload, sync. The blob store is real
# and lives under `target/`; everything else is lost when the process exits.
#
# Loopback, not the `0.0.0.0` default. That default is right for a deployment behind an ingress
# and wrong here: the fallback key below is the **published** example from
# capsule-server/.env.example, so every token this mints is forgeable by anyone who has read this
# repository — and a forgeable server reachable from the office network is a different thing from
# one reachable only from your own machine. That is also why this task is `serve-memory` and not
# `serve`; set `JWT_ED25519_DER` yourself and it is used instead.
run = """
JWT_ED25519_DER=${JWT_ED25519_DER:-MC4CAQAwBQYDK2VwBCIEIN6eTvXEL7xMZWHY8rTk7VbQSGSuRkle5MVfiiYUStLF} \
BLOB_ROOT=${BLOB_ROOT:-./target/capsule-server-blobs} \
cargo run -p capsule-server -- serve --memory --listen 127.0.0.1:3000
"""

# Regenerate the translated README.<lang>.md files from README.md and the committed
# per-locale translation data (xtask/translations/readme/). See xtask/src/translate_readme.rs.
[tasks.translate-readme]
description = "Generate README.<lang>.md from README.md + translation data"
run = "cargo run -q -p xtask -- translate-readme"

# Structural drift gate for the README translations: fails when a source block changed
# but the translations were not regenerated. Key-less and API-free (runs in CI).
[tasks.translate-readme-check]
description = "Verify README translations are in sync with README.md"
run = "cargo run -q -p xtask -- translate-readme --check"

# Scaffold/refresh a locale's translation-data file from the current README blocks.
[tasks.translate-readme-extract]
description = "Print README translatable blocks as a translation-data scaffold"
run = "cargo run -q -p xtask -- translate-readme --extract"

# ── FFI: uniffi bindings for Kotlin/Swift ────────────────────────────────────
# Two uniffi surfaces behind their crates' `ffi` feature (one pinned uniffi 0.31.1
# — the S-F1 consolidation): capsule-core's `FfiWorkspace` (offline lifecycle) and
# capsule-sdk's `FfiCapsuleClient`/`FfiSession` (the S-D9 user-flow primitives:
# login → upload → status → sync). `gen-bindings` emits the Kotlin/Swift sources for
# both from the compiled cdylibs. The `ffi-bindgen` feature adds uniffi's CLI.

[tasks.build-ffi]
run = [
  "cargo build -p capsule-core --features ffi",
  "cargo build -p capsule-sdk --features ffi",
]

[tasks.lint-check-ffi]
run = [
  "cargo clippy -p capsule-core --features ffi -- $CLIPPY_FLAGS",
  "cargo clippy -p capsule-sdk --features ffi -- $CLIPPY_FLAGS",
]

# gen-bindings, verify-examples → mise-tasks/ (shebang scripts).

# ── Cross-compilation: FFI / mobile targets ──────────────────────────────────
# capsule-core builds as cdylib+staticlib (see its [lib] crate-type) so it links
# into iOS/Android. This is the formal definition of the targets the crate
# verifies; .github/workflows/ci.yml `rust-cross` enforces it.
#
#   Tier 1 — CI-gated on every PR:
#     x86_64-unknown-linux-gnu      (host; covered by the `rust` workspace build)
#     aarch64-apple-ios             aarch64-apple-ios-sim   x86_64-apple-ios
#     aarch64-apple-darwin          x86_64-apple-darwin
#     aarch64-linux-android         armv7-linux-androideabi
#     x86_64-linux-android          i686-linux-android
#   Tier 2 — best-effort (build-only, non-blocking):
#     x86_64-pc-windows-msvc        aarch64-unknown-linux-gnu
#
# build-apple / build-android / build-linux-cross live in mise-tasks/ (platform
# guards + toolchain checks). Run `mise run targets-add` first.

[tasks.targets-add]
description = "Add rustup targets + cargo-ndk for the mobile/desktop/wasm FFI builds"
run = [
  "rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android wasm32-unknown-unknown",
  "cargo install cargo-ndk",
]

[tasks.build-windows]
description = "Build capsule-core FFI for x86_64-pc-windows-msvc (Tier 2)"
run = "cargo build -p capsule-core --features ffi --target x86_64-pc-windows-msvc"

# Sequential: each builds capsule-core into the shared target/ tree.
[tasks.build-targets]
description = "Build the Tier-1 cross targets (Apple + Android + Linux cross)"
run = ["mise run build-apple", "mise run build-android", "mise run build-linux-cross"]

# ── Web ──────────────────────────────────────────────────────────────────────

[tasks.format-web]
dir = "capsule-web"
run = "bunx biome format --write ."

[tasks.format-check-web]
dir = "capsule-web"
run = "bunx biome format ."

[tasks.lint-web]
dir = "capsule-web"
run = "bunx biome check --write ."

[tasks.lint-check-web]
dir = "capsule-web"
run = "bunx biome check ."

# Build the `capsule-wasm` browser surface (slice S-E1) and post-process it into the JS glue the
# web app + the `share-open` bun KAT import. Two deterministic, offline steps: a release wasm32
# build, then `wasm-bindgen --target web` into the gitignored `capsule-web/src/generated/wasm/`
# (build-time generation — no wasm binary is committed). Requires the `wasm32-unknown-unknown`
# rustup target (see `targets-add`) and the pinned `wasm-bindgen-cli` tool.
[tasks.build-wasm]
description = "Build capsule-wasm and emit the browser JS glue for capsule-web"
run = [
  "cargo build -p capsule-wasm --target wasm32-unknown-unknown --release",
  "wasm-bindgen target/wasm32-unknown-unknown/release/capsule_wasm.wasm --out-dir capsule-web/src/generated/wasm --target web",
]

# Generate the deterministic cross-language share-link KAT fixture the bun test reopens (Rust
# seals via the real issuer crypto; wasm reopens — proving byte-identical interop). Written to the
# gitignored capsule-web/src/generated/ tree.
#
# Ordered behind `build-wasm`, and `drop-kat` behind this one, so the three cargo tasks under
# `check-web` never run at once. They are the only cargo in that graph, and mise runs independent
# dependencies in parallel: concurrently they thrash the single `target/` lock — the same reason
# `check` and `check-rust` are sequential — and on a cold machine each one triggers rustup's
# toolchain-file auto-install, where they clobber each other's `~/.rustup/downloads/*.partial`
# and the gate dies with "could not rename 'downloaded' file". Neither fixture needs the wasm
# build; the edge is ordering, exactly as `test-swift-ui` depends on `test-swift`.
[tasks.share-kat]
description = "Generate the share-link cross-language KAT fixture for the web bun test"
depends = ["build-wasm"]
run = "cargo run -q -p xtask -- share-kat"

# Generate the deterministic cross-language guest-drop KAT fixture the bun test reproduces (slice
# S-D3): the browser (WASM) seals, and this fixture pins the byte-identical Rust `seal_drop_derand`
# output + the passphrase abuse-gate proof. Written to the gitignored capsule-web/src/generated/.
[tasks.drop-kat]
description = "Generate the guest-drop cross-language KAT fixture for the web bun test"
depends = ["share-kat"]
run = "cargo run -q -p xtask -- drop-kat"

# test-web loads the wasm module + both KAT fixtures. Naming `drop-kat` alone is enough: it
# pulls in `share-kat`, which pulls in `build-wasm`. Listing all three would say nothing extra
# and would invite someone to "parallelise" them again — see the note on `share-kat`.
[tasks.test-web]
dir = "capsule-web"
depends = ["drop-kat"]
run = "bun test --pass-with-no-tests"

# build-web bundles the guest share viewer, which imports the generated wasm glue.
[tasks.build-web]
dir = "capsule-web"
depends = ["build-wasm"]
run = "bun run build"

# ── Docs ─────────────────────────────────────────────────────────────────────

[tasks.format-docs]
dir = "capsule-docs"
run = "bunx biome format --write ."

[tasks.format-check-docs]
dir = "capsule-docs"
run = "bunx biome format ."

[tasks.lint-docs]
dir = "capsule-docs"
run = "bunx biome check --write ."

[tasks.lint-check-docs]
dir = "capsule-docs"
run = "bunx biome check ."

[tasks.test-docs]
dir = "capsule-docs"
run = "bun run test"

[tasks.build-docs]
dir = "capsule-docs"
run = "bun run build"

# Deliberately NOT a dependency of `check-docs`, and not part of `check-rust`.
# `check-docs`'s expensive step is the Astro build, which this check does not
# need and should not trigger. `check-rust`'s CI paths filter excludes
# `capsule-docs/**`, so a docs-only pull request would skip it there. It gets
# its own CI job, whose filter covers both the prose and what the prose links
# to. Runs on `node:` builtins alone: no install step.
[tasks.check-docs-truth]
description = "Prove every file, route, and anchor the docs name actually exists"
run = "bun capsule-docs/scripts/docs-truth.mjs"

# ── Kotlin ───────────────────────────────────────────────────────────────────

[tasks.format-kotlin]
run = "./gradlew ktlintFormat"

[tasks.format-check-kotlin]
run = "./gradlew ktlintCheck"

[tasks.lint-kotlin]
run = "./gradlew detekt"

[tasks.lint-check-kotlin]
run = "./gradlew detekt"

# `-Pcapsule.wireFfi` turns on the S-F3 FFI-staging tasks in capsule-core-kotlin
# (:core): generate the uniffi Kotlin bindings + build the per-ABI JNI libs as Gradle
# build inputs, so a clean checkout compiles/packages without a manual staging step.
# Needs a Rust toolchain (+ cargo-ndk & the Android NDK for the jniLibs). The lint-only
# `check-kotlin` (ktlint/detekt) deliberately omits the flag — it needs no cargo.
[tasks.test-kotlin]
run = "./gradlew test -Pcapsule.wireFfi"

[tasks.build-kotlin]
run = "./gradlew build -Pcapsule.wireFfi"

# ── Swift ────────────────────────────────────────────────────────────────────
# Swift tooling is pinned in capsule-swift/mise.toml; capsule-core-swift reuses
# those pins via `mise -C` while running in its own dir. All Swift tasks live in
# mise-tasks/ (macOS-only guards + per-dir loops): format-swift, format-check-swift,
# lint-swift, lint-check-swift, build-ffi-apple, generate-swift, build-swift.

# One-shot: build the FFI xcframework, then generate the workspace. Sequential —
# tuist generate consumes the xcframework build-ffi-apple produces.
# The default (mock) lane needs no Rust at all — `generate-swift` is enough to open
# and run the app. Use `setup-swift-ffi` only when working on the Rust-backed half.
[tasks.setup-swift]
description = "Generate the Xcode workspace for the mock lane (no Rust required)"
run = ["mise run generate-swift"]

[tasks.setup-swift-ffi]
description = "Build the FFI xcframework, then generate the Rust-backed workspace"
run = ["mise run build-ffi-apple", "TUIST_FFI=1 mise run generate-swift"]

# ── Vision ───────────────────────────────────────────────────────────────────

[tasks.format-vision]
dir = "capsule-vision"
run = "uv run ruff format"

[tasks.format-check-vision]
dir = "capsule-vision"
run = "uv run ruff format --check"

[tasks.lint-vision]
dir = "capsule-vision"
run = "uv run ruff check --fix"

[tasks.lint-check-vision]
dir = "capsule-vision"
run = "uv run ruff check && uv run ty check"

# ── Markdown ─────────────────────────────────────────────────────────────────
# Repo-wide Markdown linting (READMEs, design docs, root docs). markdownlint-cli2
# is both linter and fixer; globs/ignores live in .markdownlint-cli2.jsonc.

[tasks.lint-md]
run = "bunx markdownlint-cli2 --fix"

[tasks.lint-check-md]
run = "bunx markdownlint-cli2"

# ── Commits / release ────────────────────────────────────────────────────────
# convco enforces Conventional Commits (https://www.conventionalcommits.org).
# `commit-check` (mise-tasks/) validates a single in-progress message (commit-msg
# hook); `check-commits` validates a range (pre-push and CI on PRs).

[tasks.check-commits]
description = "Conventional Commits check over a range (default origin/master..HEAD)"
run = "convco check --first-parent --ignore-reverts {{arg(name='base', default='origin/master')}}..HEAD"

# Write one repo-wide version into every package's source of truth (Rust workspace,
# web/docs package.json, vision pyproject, Android gradle.properties, iOS Project.swift)
# and bump the Android versionCode. See xtask/src/main.rs for the per-format editors.
[tasks.set-version]
description = "Write one version into every package (via xtask)"
run = "cargo run -q -p xtask -- set-version {{arg(name='version')}}"

# Regenerate CHANGELOG.md from Conventional Commits. Pass the version when cutting a
# release so its section is titled (e.g. `mise run changelog 0.2.0`); the default
# leaves the newest section as "Unreleased". (mise quotes a passed arg, so no quotes here.)
[tasks.changelog]
description = "Regenerate CHANGELOG.md from Conventional Commits"
run = "convco changelog --unreleased {{arg(name='title', default='Unreleased')}} > CHANGELOG.md"

# ── Setup ────────────────────────────────────────────────────────────────────

[tasks.hooks-install]
description = "Install the git hooks (hk)"
run = "hk install"

[tasks.hooks-uninstall]
description = "Uninstall the git hooks (hk)"
run = "hk uninstall"

# Install per-package dependencies (named `setup`, not `install`, to avoid colliding
# with `mise install`, which installs the [tools] above).
[tasks.setup]
description = "Install web/docs/vision package dependencies"
run = [
  "cd capsule-web && bun install",
  "cd capsule-docs && bun install",
  "cd capsule-vision && uv sync",
]
