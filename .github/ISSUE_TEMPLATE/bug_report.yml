name: Bug Report
description: Something is broken or behaves differently from the docs
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A report with a version, steps to reproduce and logs can be triaged without a back-and-forth.
        **Security vulnerabilities must not be reported here.** Use a [private security advisory](https://github.com/Capsulsaurus/Capsule/security/advisories/new) instead.
        Questions belong in [Discussions › Q&A](https://github.com/Capsulsaurus/Capsule/discussions/categories/q-a).
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the [existing issues](https://github.com/Capsulsaurus/Capsule/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I read the [troubleshooting guide](https://capsule.justinchung.net/guides/troubleshooting/).
          required: true
        - label: I removed passphrases, recovery secrets, tokens, keys and personal paths from everything below.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or taps, starting from a known state.
      placeholder: |
        1. capsule import ~/Pictures/trip --library ~/Photos.capsule
        2. capsule push --library ~/Photos.capsule
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - CLI / TUI
        - Server
        - Android app
        - iOS / macOS app
        - Web app
        - Documentation
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The commit you built from (`git rev-parse --short HEAD` in your checkout), or the release version once one is published."
      placeholder: 9c99b59
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, and the device or architecture.
      placeholder: macOS 26.1 (arm64), Ubuntu 24.04 (x86_64), Pixel 9 / Android 16
    validations:
      required: true
  - type: dropdown
    id: data-loss
    attributes:
      label: Was any data lost or corrupted?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Re-run with `RUST_LOG=debug` and paste stderr, plus any `--json` output. See the troubleshooting guide for where the logs are.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, configuration (redacted), or how often it happens.
