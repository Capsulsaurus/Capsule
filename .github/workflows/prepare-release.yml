name: Prepare release

# Manually triggered. Computes the next version (or uses an explicit one), writes it
# into every package via `mise run set-version`, regenerates the CHANGELOG, and opens a
# release PR. Merging that PR to master triggers release.yml (build + GitHub Release).
#
# Opens the PR with GITHUB_TOKEN (the repo allows Actions to create pull requests). A PR
# opened by GITHUB_TOKEN does not trigger CI, so its body asks the reviewer to close and
# reopen it, which runs CI before the `required` check lets it merge.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version X.Y.Z (leave blank to compute from commits)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Install convco explicitly (below); never let `mise run` implicitly install [tools].
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  prepare:
    name: Open release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up convco (via mise)
        uses: jdx/mise-action@v5
        with:
          install_args: convco
      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(convco version --bump)"
          fi
          echo "Resolved release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Apply version + regenerate changelog
        run: |
          set -euo pipefail
          mise run set-version "${{ steps.v.outputs.version }}"
          mise run changelog "${{ steps.v.outputs.version }}"
          # The docs version switcher lists this release (capsule-docs/public/versions.json).
          node capsule-docs/scripts/add-release.mjs "${{ steps.v.outputs.version }}"
      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          branch="release/v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(release): v${version}"
          git push -u origin "$branch" --force-with-lease
          gh pr create --base master --head "$branch" \
            --title "chore(release): v${version}" \
            --body "Automated release PR for **v${version}**.

          Close and reopen this PR to run CI: a PR opened by GitHub Actions does not trigger it.

          Review the CHANGELOG and version bumps, then **merge** to tag and publish the release (release.yml builds the \`capsule\` CLI binaries and creates the GitHub Release).

          Part of the release automation (#18)."
