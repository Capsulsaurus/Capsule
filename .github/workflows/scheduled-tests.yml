name: Scheduled tests

# The testing plan's slow tiers, too long for a pull request: coverage-guided fuzzing of every
# capsule-core decoder and the server's manifest parser, mutation testing of the CRDT, transfer
# and provenance code, and the property suites at soak depth. Nightly on master, or on demand.
# A separate workflow rather than a `schedule:` on ci.yml, whose `ci-<ref>` concurrency group
# would let a nightly run and a push to master cancel each other.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: capsule-core, target: cbor_canonicalize }
          - { crate: capsule-core, target: signed_documents }
          - { crate: capsule-core, target: custody_receipt }
          - { crate: capsule-core, target: storage_attestation }
          - { crate: capsule-core, target: provenance_record }
          - { crate: capsule-core, target: lqip }
          - { crate: capsule-core, target: media_decode }
          - { crate: capsule-core, target: enrollment_payload }
          - { crate: capsule-core, target: hybrid_verifying_key }
          - { crate: capsule-core, target: metadata_blob }
          - { crate: capsule-server, target: manifest_parser }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}/fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      # The explicit host triple: a cargo-fuzz built for musl would otherwise target musl, where
      # the sanitizer cannot link (see the `fuzz` task in mise.toml).
      - name: Fuzz for ten minutes
        working-directory: ${{ matrix.crate }}/fuzz
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }}
          -- -max_total_time=600 -max_len=65536
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}/

  mutants:
    name: Mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install nextest and cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-mutants@27.1.0
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v2
        with:
          install: false
      # Exits 2 when a mutant survives and 3 when one times out: a surviving mutant is a
      # behaviour no test constrains, and the job says so rather than passing.
      - name: Mutation-test the CRDT, transfer and provenance code
        run: mise run mutants -- --shard ${{ matrix.shard }}/8 --sharding round-robin
      - name: Summarize survivors
        if: always()
        run: |
          {
            echo "### Mutants, shard ${{ matrix.shard }}/8"
            for kind in caught missed timeout unviable; do
              file="mutants.out/$kind.txt"
              [ -f "$file" ] && echo "- $kind: $(wc -l < "$file")"
            done
            if [ -s mutants.out/missed.txt ]; then
              echo
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/

  properties:
    name: Property suites (soak)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # A fresh seed each night widens the search; it is printed in every case's stderr, and
      # `PROPTEST_RNG_SEED=<seed>` replays a failure locally.
      - name: Run the property suites at depth under the run's seed
        env:
          PROPTEST_CASES: "4096"
          PROPTEST_RNG_SEED: ${{ github.run_id }}
        run: >-
          cargo nextest run -p capsule-core -p capsule-sdk --no-fail-fast
          --test codec_properties --test crdt_laws --test upload_fault_schedules

  # The kill-anywhere suite (#678) at soak depth: the pull request's two seeds become many, in
  # four shards so each stays inside the suite's 30-minute nextest leash. Each shard starts from
  # a seed derived from the run id, so every night searches new kill points; every seed's
  # schedule is printed, and `CAPSULE_KILL_SEED=<seed> CAPSULE_KILL_SEEDS=1` replays one.
  kill-anywhere:
    name: Kill anywhere (soak, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install nasm and libdav1d
        run: sudo apt-get update && sudo apt-get install -y nasm libdav1d-dev
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Kill anywhere under the run's seeds
        env:
          CAPSULE_TEST_KILL_ANYWHERE: "1"
          CAPSULE_KILL_SEEDS: "16"
          CAPSULE_KILL_LOG_DIR: ${{ github.workspace }}/target/kill-anywhere-logs
        run: |
          set -euo pipefail
          export CAPSULE_KILL_SEED=$(( ${{ github.run_id }} * 4 * 16 + ${{ matrix.shard }} * 16 ))
          log=target/nextest/kill-anywhere.log
          mkdir -p "$(dirname "$log")"
          cargo nextest run -p capsule-e2e --test kill_anywhere --retries 0 \
            --no-tests=fail --success-output final 2>&1 | tee "$log"
          if grep -n 'skipping kill-anywhere' "$log" >&2; then
            echo "kill-anywhere skipped instead of running; check the container runtime." >&2
            exit 1
          fi
      - name: Upload the processes' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kill-anywhere-logs-${{ matrix.shard }}
          path: target/kill-anywhere-logs/
