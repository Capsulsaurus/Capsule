name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# mise is the task runner here, but it must never implicitly install [tools] — each
# job installs exactly what it needs (nextest via taiki-e on the Rust jobs, convco via
# mise on the release/commit-lint jobs). hk is local-only and never installed in CI.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  # Detect which toolchain's dependency tree changed so each job only runs when relevant.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      docs-truth: ${{ steps.filter.outputs.docs-truth }}
      markdown: ${{ steps.filter.outputs.markdown }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'Cross.toml'
              - 'mise.toml'
              - 'mise-tasks/**'
              - '.config/nextest.toml'
              - 'hk.pkl'
              - '.cargo/**'
              - 'capsule-server/**'
              - 'capsule-i18n/**'
              - 'capsule-cli/**'
              - 'capsule-e2e/**'
              - 'capsule-core/**'
              - 'capsule-library/**'
              - 'capsule-sdk/**'
              - 'capsule-core-ffi/**'
              - 'capsule-wasm/**'
              - 'xtask/**'
              # `check-rust` reads the catalogs directly: `i18n-check` and
              # `i18n-guard` are `cargo run -p xtask -- i18n …` over `locales/`,
              # so a catalog-only change must still pay the Rust gate. The
              # `swift` filter already lists it for the same reason.
              #
              # `i18n-check` compares `locales/` against its *generated* outputs,
              # and drift is drift whichever side moved — a hand-edit to a
              # generated catalog is the case it exists to catch. `check-rust` is
              # the only task that runs it and the `rust` job is the only job that
              # runs `check-rust`, so these four globs are what makes the CI gate
              # at least as wide as the local one — hk.pkl's `i18n-check` step
              # lists the same generated targets (the two remaining entries of
              # that glob, `capsule-i18n/src/**` and `xtask/src/i18n.rs`, are
              # already covered here by `capsule-i18n/**` and `xtask/**`). Keep
              # the two in step.
              - 'locales/**'
              - 'capsule-web/src/i18n/messages/**'
              - 'capsule-swift/Generated/**'
              - 'capsule-android/src/androidMain/res/values*/strings.xml'
              - '.github/workflows/ci.yml'
            web:
              - 'capsule-web/**'
              - 'mise.toml'
              - 'mise-tasks/**'
              - '.github/workflows/ci.yml'
            # Every artifact the docs build reads, not just `capsule-docs/**` — the
            # generator turns two committed description artifacts into the `/reference/`
            # pages, so a filter that names only the site lets a stale reference page
            # publish on a change to the surface it describes. See
            # design/developer-docs.md, "Artifacts cross the boundary, not toolchains".
            docs:
              - 'capsule-docs/**'
              - 'capsule-cli/cli-surface.json'
              - 'capsule-server/openapi.json'
              # `capsule-docs/biome.jsonc` extends the root one, so a change there can fail
              # this job's format and lint steps from outside `capsule-docs/**`.
              - 'biome.jsonc'
              - 'mise.toml'
              - 'mise-tasks/**'
              - '.github/workflows/ci.yml'
            # Both sides this gate cross-references: the prose, and the things
            # the prose names — the committed OpenAPI contract and the crate
            # source trees. Renaming a module or regenerating the server surface
            # can invalidate a citation without the citing doc changing, and
            # neither the `docs` nor the `rust` filter would catch that. The
            # job installs nothing, so a broad filter is cheap here.
            docs-truth:
              - 'capsule-docs/scripts/**'
              - 'capsule-docs/src/content/docs/**'
              - 'capsule-docs/astro.config.mjs'
              - 'capsule-docs/endpoint-census-allowlist.txt'
              - 'capsule-docs/planned-modules.txt'
              - 'capsule-server/openapi.json'
              # No check reads this one today; it is here because the cross-links check
              # resolves any repo-relative path a document names, and the reference prose
              # now names this artifact. Cheap: the job installs nothing.
              - 'capsule-cli/cli-surface.json'
              - 'capsule-*/src/**'
              - '**/*.md'
              - '**/*.mdx'
              - 'LICENSE'
              - 'NOTICE'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            markdown:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - 'mise.toml'
              - 'mise-tasks/**'
              - '.github/workflows/ci.yml'
            swift:
              - 'capsule-swift/**'
              - 'capsule-core-swift/**'
              - 'locales/**'
              - 'mise.toml'
              - 'mise-tasks/**'
              - '.github/workflows/ci.yml'
            kotlin:
              - 'capsule-android/**'
              - 'capsule-core-kotlin/**'
              - '**/*.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.editorconfig'
              - 'detekt.yml'
              - 'mise.toml'
              - 'mise-tasks/**'
              - '.github/workflows/ci.yml'

  # Enforce Conventional Commits across a PR's commits (convco skips merge commits).
  # Runs on pull_request only; on push to master it is skipped (the `required` gate
  # treats skipped as pass). Tooling is pinned in the root mise.toml.
  commit-lint:
    name: Commit lint (convco)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up convco (via mise)
        uses: jdx/mise-action@v4
        with:
          # The fully-qualified backend name matching the mise.toml pin — the bare
          # short name stopped resolving in the mise 2026.7.0 registry.
          install_args: cargo:convco
      - name: Check commits follow Conventional Commits
        run: convco check --first-parent --ignore-reverts ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  rust:
    name: Rust (fmt + clippy + build)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          # `check-rust` includes `build-check-wasm`, which type-checks the
          # wasm32 sealing build. Without the target, cargo cannot find `core`
          # and the whole gate fails on the first dependency it compiles.
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # `--workspace` builds capsule-cli, which enables capsule-core's `media-linked-codecs`
      # (#437): rav1e's x86_64 assembly needs nasm. cmake, a C++ compiler and libclang (for
      # libjxl and its bindgen bindings) are already on the runner image. It also enables
      # `media-avif-decode` (#588), whose `dav1d-sys` links the system libdav1d through
      # pkg-config and has no vendored build, so the headers and `dav1d.pc` come from
      # libdav1d-dev.
      - name: Install nasm and libdav1d
        run: sudo apt-get update && sudo apt-get install -y nasm libdav1d-dev
      # check-rust runs the verify-examples smoke via nextest.
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # check-rust runs the dependency-licence gate via cargo-deny. mise is set up with
      # install: false, so the [tools] pin does not put it on PATH here.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Check (fmt + clippy + build)
        run: mise run check-rust
      # The cargo-fuzz targets live in their own workspace, which no step above builds. Type-
      # checking them on every pull request keeps a decoder change from silently breaking a
      # target the scheduled workflow only runs nightly.
      - name: Check fuzz targets
        run: mise run fuzz-check

  # RustSec advisories, crate bans and crate sources against Cargo.lock (#507). Not gated on
  # the `changes` filter: an advisory is published against a lockfile nobody touched, so the
  # check runs on every pull request and every push to master, and a new one fails the next
  # run. It reads only Cargo metadata, so no build and no cache. An advisory with no
  # reachable fix is ignored by id, with its reason, in deny.toml.
  rust-advisories:
    name: Rust (dependency advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Check advisories, bans and sources
        run: mise run deny-check

  rust-test:
    name: Rust (tests)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    # Blocking as of `S-C59`. It was non-blocking because the Salvo auth crate's integration
    # tests needed testcontainers (Docker), which is slower and flakier; that crate is now
    # review material. Every case this job runs uses a deterministic in-memory adapter, and
    # Kynos's `TestClient` drives a built service in-process; the container-gated cases skip
    # here and run against real Postgres and Valkey containers in `rust-containers`. A gate
    # that is allowed to fail is not a gate.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # nasm for rav1e's x86_64 assembly (#437) and libdav1d for AVIF decode (#588); see the
      # `rust` job.
      - name: Install nasm and libdav1d
        run: sudo apt-get update && sudo apt-get install -y nasm libdav1d-dev
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Test
        env:
          NEXTEST_PROFILE: ci
        run: mise run test-rust
      # The release-profile half: `#[cfg(not(debug_assertions))]` tests are compiled out of
      # every test-profile build above. Scoped to the crates that carry one, with a guard that
      # fails when one appears anywhere else (see `test-rust-release` in mise.toml, #428).
      - name: Test (release profile)
        env:
          NEXTEST_PROFILE: ci
        run: mise run test-rust-release

  # The container tiers `rust-test` skips (#514). Every Postgres adapter conformance suite, the
  # migration round trip, the durable boot arm and process cases, and the Valkey suite are gated
  # on CAPSULE_TEST_POSTGRES / CAPSULE_TEST_VALKEY and pass as skipped without them — so before
  # this job none of them had ever run in CI, and a broken adapter reported green. The task
  # admits both tiers and fails on any skip line, so a runner that lost its container runtime
  # fails here instead of passing vacuously. Each case starts its own container through
  # testcontainers on the runner's Docker socket; no `services:` block, because a shared
  # service would break the one-container-per-case isolation the suites rely on.
  rust-containers:
    name: Rust (container tiers)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # nasm and libdav1d: capsule-e2e links capsule-cli's codecs through capsule-library, as
      # in the `rust` job.
      - name: Install nasm and libdav1d
        run: sudo apt-get update && sudo apt-get install -y nasm libdav1d-dev
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Test (Postgres + Valkey containers)
        env:
          NEXTEST_PROFILE: ci
        run: mise run test-rust-containers

  # The kill-anywhere suite (#678): the real `capsule` and `capsule-server` binaries over a
  # Postgres and a Valkey container, with either process SIGKILLed at seeded points during
  # the phases whose kill points are armed, and every phase rerun to convergence (the suite's
  # header says which are armed and why). It skips without
  # CAPSULE_TEST_KILL_ANYWHERE, so the job sets it and fails on the skip line, as
  # `rust-containers` does. A pull request runs the default two seeds; the nightly soak in
  # scheduled-tests.yml runs many more. `--retries 0`: a convergence failure that only happens
  # sometimes is exactly the bug this suite hunts, and a retry would file it under "flaky".
  rust-kill-anywhere:
    name: Rust (kill-anywhere)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # nasm and libdav1d: capsule-cli's codecs, as in the `rust` job.
      - name: Install nasm and libdav1d
        run: sudo apt-get update && sudo apt-get install -y nasm libdav1d-dev
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Kill anywhere
        env:
          NEXTEST_PROFILE: ci
          CAPSULE_TEST_KILL_ANYWHERE: "1"
          CAPSULE_KILL_LOG_DIR: ${{ github.workspace }}/target/kill-anywhere-logs
        run: |
          set -euo pipefail
          log=target/nextest/kill-anywhere.log
          mkdir -p "$(dirname "$log")"
          cargo nextest run -p capsule-e2e --test kill_anywhere --retries 0 \
            --no-tests=fail --success-output final 2>&1 | tee "$log"
          if grep -n 'skipping kill-anywhere' "$log" >&2; then
            echo "kill-anywhere skipped instead of running; check the container runtime." >&2
            exit 1
          fi
      - name: Upload the processes' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kill-anywhere-logs
          path: target/kill-anywhere-logs/

  # `capsule auth login --oidc` against a real identity provider (#640). The round trip in
  # capsule-cli/tests/oidc_dex.rs skips unless CAPSULE_TEST_DEX=1, so `rust-test` passes it
  # vacuously; this job is where it runs. It brings up compose.yaml's own dex service (v2.44.0,
  # its inline config, so CI and a developer's machine sign in to the same provider), starts
  # the in-memory server the test file's header names with the three OIDC variables, and fails
  # on a skip line just as `test-rust-containers` does. Every wait is bounded: compose's
  # `--wait-timeout` on dex's healthcheck, curl's retry count on the server's `/v1/version`.
  rust-oidc:
    name: Rust (OIDC round trip)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # nasm and libdav1d: capsule-cli's codecs, as in the `rust` job.
      - name: Install nasm and libdav1d
        run: sudo apt-get update && sudo apt-get install -y nasm libdav1d-dev
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Start dex
        run: docker compose -f capsule-server/compose.yaml --profile oidc up -d --wait --wait-timeout 120 dex
      - name: Build the server and the round trip
        run: |
          cargo build -p capsule-server
          cargo nextest run -p capsule-cli --test oidc_dex --no-run
      # The same arguments as `mise run serve-memory`, run from the binary just built so the
      # readiness probe below waits on boot rather than on a compile.
      - name: Start the OIDC-configured server
        env:
          OIDC_ISSUER: http://127.0.0.1:5556/dex
          OIDC_CLIENT_ID: capsule
          OIDC_ALLOW_LOOPBACK_REDIRECT: "true"
          JWT_ED25519_DER: MC4CAQAwBQYDK2VwBCIEIN6eTvXEL7xMZWHY8rTk7VbQSGSuRkle5MVfiiYUStLF
          BLOB_ROOT: ./target/capsule-server-blobs
        run: |
          nohup ./target/debug/capsule-server serve --memory --listen 127.0.0.1:3000 \
            > "$RUNNER_TEMP/capsule-server.log" 2>&1 &
          curl --silent --show-error --fail --retry 60 --retry-delay 1 --retry-connrefused \
            --output /dev/null http://127.0.0.1:3000/v1/version
      - name: Test (dex round trip)
        shell: bash
        env:
          NEXTEST_PROFILE: ci
          CAPSULE_TEST_DEX: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/oidc_dex.log"
          cargo nextest run -p capsule-cli --test oidc_dex --no-tests=fail --success-output final 2>&1 | tee "$log"
          if grep -nE 'skipped: ' "$log" >&2; then
            echo "rust-oidc: the round trip skipped instead of running against dex." >&2
            exit 1
          fi
      - name: Show the server and dex logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/capsule-server.log" || true
          docker compose -f capsule-server/compose.yaml --profile oidc logs dex || true

  # Verify the app FFI — capsule-sdk with `--features ffi`, plus the capsule-core-ffi
  # umbrella on Apple, both linking capsule-core — cross-compiles to the formally
  # supported targets (mobile + desktop). Tier 1 (Apple, Android) gates; Tier 2 (Windows MSVC, aarch64 Linux)
  # is best-effort via continue-on-error. The host x86_64 Linux Tier-1 target is
  # already covered by the `rust` job's workspace build.
  rust-cross:
    name: Rust cross (${{ matrix.name }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.tier2 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple
            os: macos-14
            recipe: build-apple
            targets: aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
            tier2: false
          - name: android
            os: ubuntu-latest
            recipe: build-android
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
            tier2: false
          - name: windows
            os: windows-latest
            recipe: build-windows
            targets: x86_64-pc-windows-msvc
            tier2: true
          - name: linux-arm64
            os: ubuntu-latest
            recipe: build-linux-cross
            targets: aarch64-unknown-linux-gnu
            tier2: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.targets }}
      - name: Set up Android NDK
        if: matrix.name == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Export ANDROID_NDK_HOME
        if: matrix.name == 'android' && steps.ndk.outputs.ndk-path != ''
        run: echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        if: matrix.name == 'android'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Install cross
        if: matrix.name == 'linux-arm64'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.name }}
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Build target
        run: mise run ${{ matrix.recipe }}

  web:
    name: Web (format + lint + test + build)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3" # pinned: a newer bun rewrites bun.lock and fails --frozen-lockfile
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-web-${{ runner.os }}-${{ hashFiles('capsule-web/bun.lock') }}
          restore-keys: bun-web-${{ runner.os }}-
      - name: Install dependencies
        working-directory: capsule-web
        run: bun install --frozen-lockfile
      # `check-web` is not pure bun: `test-web` and `build-web` depend on
      # `build-wasm` / `share-kat` / `drop-kat`, which are cargo (slices S-E1 and
      # S-D3 added them; this job's step list predates that and was never updated).
      # Without an explicit install here, each of those tasks triggers rustup's
      # toolchain-file auto-install itself, and they clobber each other's
      # `~/.rustup/downloads/*.partial`.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          # `build-wasm` compiles capsule-wasm for the browser. The target is not
          # in rust-toolchain.toml — that pins the iOS targets only.
          rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # `build-wasm` shells out to wasm-bindgen. It is a [tools] pin, but this
      # workflow sets MISE_AUTO_INSTALL=false, so it has to be asked for by name.
      # After the rustup step, never before: cargo-built mise tools race the
      # toolchain bootstrap (see the note at the top of build-ios.yml).
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install_args: "cargo:wasm-bindgen-cli"
      - name: Check (format + lint + test + build)
        run: mise run check-web

  docs:
    name: Docs (format + lint + test + build)
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3" # pinned: a newer bun rewrites bun.lock and fails --frozen-lockfile
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-docs-${{ runner.os }}-${{ hashFiles('capsule-docs/bun.lock') }}
          restore-keys: bun-docs-${{ runner.os }}-
      - name: Install dependencies
        working-directory: capsule-docs
        run: bun install --frozen-lockfile
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Check (format + lint + test + build)
        run: mise run check-docs

  # No `bun install` step: the scripts import only `node:` builtins, so this job
  # needs a runtime and nothing else. That is deliberate, not an omission.
  docs-truth:
    name: Docs truth (names resolve)
    needs: changes
    if: ${{ needs.changes.outputs.docs-truth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3" # pinned: a newer bun rewrites bun.lock and fails --frozen-lockfile
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Check (every file, route, and anchor the docs name)
        run: mise run check-docs-truth

  markdown:
    name: Markdown (lint)
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3" # pinned: a newer bun rewrites bun.lock and fails --frozen-lockfile
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Check (markdown lint)
        run: mise run check-md

  kotlin:
    name: Kotlin (ktlint + detekt)
    needs: changes
    # TODO(track:deferred): re-enable when mobile resumes — see #389 (Android) and #391–#393 (Apple).
    # Mobile apps are deferred while the server and CLI are stabilized. `false &&` disables the
    # job (a bare `if: false` trips actionlint's constant-condition check); deleting it, and
    # re-adding this job to `required`, re-enables the gate.
    if: ${{ false && needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle 8.11.1 supports JDK 21 (not the JDK 26 used on some dev machines).
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The :android module applies the Android Gradle Plugin, so Gradle needs the SDK
      # (compileSdk 36) just to configure — even for the ktlint/detekt tasks.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          install: false
      - name: Check (ktlint + detekt)
        run: mise run check-kotlin

  # The Apple client's mock lane: no Rust core, no xcframework, no cross-compile — so
  # this gate is fast and runs on every PR that touches the app. The Rust-backed lane
  # lives in build-ios.yml behind its own path filter.
  swift:
    name: Swift (format + lint + unit tests on macOS/iOS/iPadOS + iPhone UI sweep)
    needs: changes
    # TODO(track:deferred): re-enable when mobile resumes — see #389 (Android) and #391–#393 (Apple).
    # Mobile apps are deferred while the server and CLI are stabilized. `false &&` disables the
    # job (a bare `if: false` trips actionlint's constant-condition check); deleting it, and
    # re-adding this job to `required`, re-enables the gate.
    if: ${{ false && needs.changes.outputs.swift == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up mise (task runner)
        uses: jdx/mise-action@v4
        with:
          working_directory: capsule-swift
          install_args: tuist swiftlint swiftformat xcbeautify
      - name: Check (format + lint + unit tests + UI sweep)
        # `check-swift` now also boots an iPhone simulator and walks the app, so
        # this job is minutes rather than seconds. That is the trade: section
        # reachability is the kind of regression that unit tests cannot see —
        # fifteen sections were unreachable on iPhone while every suite passed.
        timeout-minutes: 45
        run: mise run check-swift

  # Single aggregated status check. Mark THIS ("CI / required") as the required
  # check in branch protection — path-filtered jobs report "skipped", which this
  # treats as a pass. Every job in `needs` is verified below: the loop covers the
  # eleven gates (`rust-test` included — it became blocking with `S-C59`, see the
  # note on that job — `rust-containers`, blocking from the start, #514, `rust-oidc`, #640, and
  # `rust-advisories`, unfiltered, #507), and `changes` is checked ahead of it under a stricter rule,
  # because "skipped" is only trustworthy when the filter that skipped it ran.
  # A job in `needs` but absent from both checks is a gate that cannot fail.
  required:
    name: required
    if: always()
    # TODO(track:deferred): re-add `kotlin` and `swift` here and to the loop below when mobile
    # resumes — see #389 (Android) and #391–#393 (Apple). Both jobs are disabled (`if: false`).
    needs: [changes, commit-lint, rust, rust-advisories, rust-test, rust-containers, rust-kill-anywhere, rust-oidc, rust-cross, web, docs, docs-truth, markdown]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          # `changes` must have SUCCEEDED, not merely "not failed". Every filtered
          # job's `if:` reads needs.changes.outputs.*; if that job dies (a checkout
          # hiccup, a paths-filter error) those outputs are empty, so every gate
          # evaluates false and reports "skipped" — and `if: always()` still runs
          # this one. Treating those skips as passes would green-light a merge with
          # zero toolchain gates executed, which is the failure mode this whole job
          # exists to prevent. It is the one `needs` entry that cannot be skipped:
          # unlike `commit-lint` (push events) or the filtered gates, it has no `if:`.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "The path-filter job did not succeed (result: ${{ needs.changes.result }})."
            echo "Every filtered gate would report skipped, so this aggregate proves nothing."
            exit 1
          fi
          for r in "${{ needs.commit-lint.result }}" "${{ needs.rust.result }}" \
                   "${{ needs.rust-advisories.result }}" \
                   "${{ needs.rust-test.result }}" "${{ needs.rust-containers.result }}" \
                   "${{ needs.rust-kill-anywhere.result }}" \
                   "${{ needs.rust-oidc.result }}" "${{ needs.rust-cross.result }}" \
                   "${{ needs.web.result }}" \
                   "${{ needs.docs.result }}" "${{ needs.docs-truth.result }}" \
                   "${{ needs.markdown.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not pass (result: $r)."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
