name: Build Apple client (Rust-backed lane)

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "capsule-swift/**"
      - "capsule-core/**"
      - "capsule-core-ffi/**"
      # The umbrella staticlib carries capsule-sdk's uniffi surface (S-F3/S-D9).
      - "capsule-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-ios.yml"
  # Manual trigger for the hardware-backed Secure Enclave lane (self-hosted; see below).
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

# mise is only a tool installer / exec shim here; never let it implicitly install the
# root mise.toml [tools]. The cargo-built convco/cargo-nextest in particular build from
# source and race rustup's toolchain bootstrap, which breaks this job. Same convention
# as ci.yml: each job installs exactly what it needs.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build & test Capsule.app against the Rust core
    # macOS 26 host: provides libswiftCompatibilitySpan.dylib natively, which the
    # Xcode 26 / Swift 6.2 toolchain's prebuilt CLIs (tuist, xcbeautify) link
    # against via @rpath. On macos-15 dyld can't find it and `tuist generate`
    # aborts. See https://developer.apple.com/forums/thread/817488
    runs-on: macos-26
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Install only the Swift tools this job actually uses (tuist to generate the
      # project, xcbeautify to format the build/test log) — not the root [tools].
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          working_directory: capsule-swift
          install_args: tuist xcbeautify

      - name: Build Rust FFI xcframework
        run: bash capsule-swift/Scripts/build-rust-ffi.sh

      # TUIST_FFI=1 selects the Rust-backed graph: `CapsuleCatalogFFI` joins the
      # project, compiling the generated uniffi glue and linking the xcframework
      # built above. Without it the app builds against the in-memory catalog, which
      # is what the fast `swift` job in ci.yml covers.
      - name: Generate Xcode project (FFI lane)
        working-directory: capsule-swift
        env:
          TUIST_FFI: "1"
        run: mise exec -- tuist generate --no-open

      - name: Build & test
        run: |
          set -o pipefail
          # Resolve an available iPhone simulator at runtime — the runner image's
          # specific models churn (e.g. iPhone 16 → 17), so pinning a name breaks.
          sim_id=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $sim_id"
          xcodebuild test \
            -workspace capsule-swift/Capsule.xcworkspace \
            -scheme Capsule \
            -configuration Debug \
            -destination "id=$sim_id" \
            CODE_SIGNING_ALLOWED=NO | mise -C capsule-swift exec -- xcbeautify

      # The Rust core must link into the Mac app too, not just the simulator —
      # macOS is a first-class destination and its staticlib slice is the one most
      # likely to rot unnoticed.
      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace capsule-swift/Capsule.xcworkspace \
            -scheme Capsule \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO | mise -C capsule-swift exec -- xcbeautify

  # On-device Secure Enclave lane. The Secure Enclave is real hardware — the iOS
  # Simulator has no SE, so the hardware-signer / hardware-DEK paths (S-F2 / S-F5) can
  # only run on a physical device, which needs code signing + a provisioning profile.
  # This lane is therefore manual + self-hosted: add a macOS runner with an attached,
  # provisioned device carrying the `secure-enclave` label to activate it. Until then it
  # is inert — matching the repo convention of gating hardware runs behind a label rather
  # than faking them on a hosted runner. (The Secure Enclave path itself already RAN on
  # the author's host per SLICES.md S-F2; this lane is its reproducible CI home.)
  device:
    name: Secure Enclave on device (self-hosted)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos, secure-enclave]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          working_directory: capsule-swift
          install_args: tuist xcbeautify

      - name: Build Rust FFI xcframework
        run: bash capsule-swift/Scripts/build-rust-ffi.sh

      - name: Generate Xcode project
        working-directory: capsule-swift
        run: mise exec -- tuist generate --no-open

      # A generic iOS device destination; signing is supplied by the self-hosted runner's
      # keychain + provisioning profile (configured out-of-band, not in this workflow).
      - name: Build & test on device
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace capsule-swift/Capsule.xcworkspace \
            -scheme Capsule \
            -configuration Debug \
            -destination "generic/platform=iOS" | mise -C capsule-swift exec -- xcbeautify
