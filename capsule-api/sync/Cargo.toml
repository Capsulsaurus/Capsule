[package]
name = "capsule-api-sync"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "sync"
path = "src/lib.rs"

[dependencies]
capsule-api-auth = { path = "../auth" }
capsule-api-entity = { path = "../entity" }
capsule-api-environment = { path = "../environment", features = ["sync"] }
capsule-api-service = { path = "../service" }
capsule-core = { path = "../../capsule-core" }
capsule-i18n = { path = "../../capsule-i18n" }
eyre = { workspace = true }
futures-util = { workspace = true }
http-body-util = "0.1"
prost = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
prost-types = { workspace = true }
salvo = { workspace = true }
sea-orm = { workspace = true, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tonic = { workspace = true, features = ["transport", "gzip"] }
tonic-web = "0.14.6"
tonic-prost = { workspace = true }
tonic-health = { workspace = true }
tonic-types = { workspace = true }
sync_wrapper = "1.0"
tokio-stream = "0.1"
jsonwebtoken = { workspace = true }
tower = "0.5.3"
jiff = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
indexmap = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
migration = { path = "../migration", package = "capsule-api-migration" }
# The real `capsule-sdk` sync consumer driving THIS crate's served feed over a
# real tonic channel — the S-D2 cross-module integration (mirrors upload's
# `tests/sdk_client.rs`). The SDK is a dev-dep so the client and the server it
# consumes are exercised together end-to-end.
capsule-sdk = { path = "../../capsule-sdk" }
# The real `capsule-cli` command functions driving the auth+sync services end to
# end — the S-D5 CLI round-trip (auth login → sync → list). The CLI is the leaf
# client, so it is a dev-dep here (not the reverse): keeping the server stack out
# of the CLI's own dev-deps mirrors how S-D1/S-D2 host their client tests in the
# server crate. `cli-migration` provisions the CLI's sync-fed SQLite store.
capsule-cli = { path = "../../capsule-cli" }
cli-migration = { path = "../../capsule-cli/migration", package = "capsule-cli-migration" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
sea-orm-migration = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
nanoid = { workspace = true }
jiff = { workspace = true }
