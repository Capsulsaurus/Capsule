# Local dependencies for `mise run serve-api`.
#
# Postgres and Valkey are the server's only external services. There is deliberately no
# object store: blobs are written to the filesystem `UPLOAD_DIR` (see
# capsule-api/environment, capsule-api/src/bin/{gc,scrub}.rs). A MinIO service used to sit
# here and was never wired to anything — removed in S-P7 so this file describes what the
# code actually needs.

services:
  postgres:
    image: docker.io/library/postgres:17
    ports:
      - "5432:5432"
    environment:
      # These variables default to the specified values if not set externally.
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: capsule
      POSTGRES_DB: capsule
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z,U

  valkey:
    image: docker.io/valkey/valkey:8.1.1
    ports:
      - "6379:6379"
    environment:
      # Default credentials; override via environment or .env file.
      VALKEY_EXTRA_FLAGS: "--maxmemory 4G --maxmemory-policy volatile-lru --save 900 1 300 10 --appendonly yes --appendfsync everysec --no-appendfsync-on-rewrite yes --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb --lazyfree-lazy-eviction yes --lazyfree-lazy-expire yes --lazyfree-lazy-server-del yes --replica-lazy-flush yes --protected-mode no --tcp-keepalive 60 --loglevel notice --slowlog-log-slower-than 10000 --slowlog-max-len 128 --io-threads 4"
    volumes:
      - valkey_data:/data:Z,U

volumes:
  postgres_data:
  valkey_data:
