[package]
name = "capsule-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "capsule-api"

[dependencies]
capsule-api-auth = { path = "./auth", optional = true }
capsule-api-media = { path = "./media", optional = true }
capsule-api-upload = { path = "./upload", optional = true }
capsule-api-sync = { path = "./sync", optional = true }
capsule-api-environment = { path = "./environment" }
capsule-api-migration = { path = "./migration" }
capsule-api-service = { path = "./service" }
salvo = { workspace = true }
color-eyre = "0.6.5"
eyre = { workspace = true }
listenfd = "1.0.2"
sea-orm = { workspace = true, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "debug-print",
] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
# `keygen` (S-P7) base64-encodes the minted PKCS#8 DER for pasting into `.env`.
base64 = { workspace = true }

[features]
default = ["full"]
full = ["auth", "upload", "media", "sync", "openapi"]
h2c = ["salvo/http2-cleartext", "salvo/rustls"]
auth = ["capsule-api-auth", "capsule-api-environment/auth"]
upload = ["capsule-api-upload", "capsule-api-environment/upload"]
media = ["capsule-api-media", "capsule-api-environment/media"]
sync = ["capsule-api-sync", "capsule-api-environment/sync", "h2c"]
openapi = []
