[package]
name = "capsule-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# `lib` (rlib) keeps the rest of the workspace linking capsule-core unchanged.
# `cdylib` is the Android `.so` and `staticlib` the iOS XCFramework input for the
# uniffi bindings (see the `ffi` feature). Cargo cannot gate crate-type by feature,
# so host builds also emit these artifacts — an accepted, cheap cost.
crate-type = ["lib", "cdylib", "staticlib"]

# Generates the Kotlin/Swift bindings from the compiled cdylib (library mode). Built
# only with `--features ffi-bindgen`, so the `cli` deps never enter the mobile artifact.
[[bin]]
name = "uniffi-bindgen"
required-features = ["ffi-bindgen"]

[features]
# `native` (default) is the on-device library/import/lifecycle surface: it links SQLite,
# the filesystem, and the media stack. Turning it OFF (`--no-default-features`) leaves only
# the WASM sealing surface (`cbor` + `crypto` + `drop`), which targets
# `wasm32-unknown-unknown` for the guest web-upload client (see `drop::seal_drop`). Build:
#   cargo build -p capsule-core --target wasm32-unknown-unknown --no-default-features
default = ["native"]
native = ["dep:rusqlite"]
# `ffi` exposes the uniffi-annotated surface (FfiWorkspace + foreign traits). It wraps the
# native `lifecycle::Workspace`, so it implies `native`. `ffi-bindgen` additionally pulls
# uniffi's CLI so the `uniffi-bindgen` bin can emit the bindings.
ffi = ["native", "dep:uniffi"]
ffi-bindgen = ["ffi", "uniffi/cli"]
# `media` exposes the decode/encode + media-metadata utilities (the former standalone
# `capsule-media` crate) as `capsule_core::media`. Non-default so the default library
# build (crypto data plane, CLI, FFI, future WASM) never compiles the media stack;
# `capsule-api-upload` opts in.
media = [
    "native",
    "dep:base64",
    "dep:file-format",
    "dep:jpeg-encoder",
    "dep:memmap2",
    "dep:num-rational",
    "dep:thumbhash",
    "dep:tokio",
    "dep:zune-core",
    "dep:zune-jpeg",
]
# `tpm` builds the desktop (Linux/Windows) TPM 2.0 reference `HardwareSigner` (see
# `crypto::keys::tpm`). Off by default and never built in CI: tss-esapi links the system
# `libtss2` and exercising it needs a real TPM or a software TPM (swtpm). Compile on a
# TPM-capable host with `--features tpm`.
tpm = ["dep:tss-esapi"]

[dependencies]
ciborium = "0.2"
half = "2"               # IEEE-754 f16 for RFC 8949 §4.2 shortest-float canonical CBOR
globset = "0.4.18"
indexmap = { workspace = true }
jiff = { workspace = true }
kamadak-exif = "0.5"
# Bundled SQLite (C) — the on-device library index. Optional + gated by `native` because it
# cannot target `wasm32-unknown-unknown`; the WASM sealing build drops it.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { workspace = true }
serde_bytes = "0.11"     # CBOR byte-string (de)serialization for keys/signatures
serde_json = { workspace = true }
thiserror = { workspace = true }
tzf-rs = "0.4"
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
walkdir = "2"
sha2 = { workspace = true }
hex = { workspace = true }

# ── Cryptography (data plane) ──────────────────────────────────────────────
# Pin the STABLE RustCrypto line: aes-gcm 0.11 / aead 0.6 deleted the STREAM module.
aes-gcm = { version = "0.10", features = ["aes"] }
aead = { version = "0.5", features = ["stream", "alloc"] }
hkdf = "0.12"
hmac = "0.12"
sha3 = "0.10"            # SHA3-256 combiner + SHAKE256 seed expansion for the X-Wing KEM
argon2 = { workspace = true }
ed25519-dalek = "2"
# RustCrypto NIST P-256 ECDSA — the classical half of the hardware-backed hybrid DSK
# (Secure Enclave / StrongBox / TPM expose P-256, not Ed25519; see the P-256 hybrid-DSK
# variant in `crypto::keys::p256`). Already in the workspace tree via `jsonwebtoken`; the
# software `p256` signer is the reference/mock a real secure element replaces. DER ECDSA
# over SHA-256 — `default-features = false` drops the unused `pem`/`pkcs8`/`std` surface.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
ml-dsa = "0.1"            # RustCrypto FIPS-204 (ML-DSA-65) — the PQ signature half
ml-kem = "0.3"           # RustCrypto FIPS-203 (ML-KEM-768) — PQ half of the X-Wing device KEM
x25519-dalek = "2"       # RustCrypto X25519 — classical half of the X-Wing device KEM
getrandom = "0.3"        # OS CSPRNG for keys, salts, nonce prefixes
tar = "0.4"              # deterministic uncompressed POSIX tar backup container
sharks = "0.5"           # Shamir secret sharing (opt-in 2-of-3 recovery)

# ── Media (optional; `media` feature) — decode/encode + media metadata ──────
base64 = { workspace = true, optional = true }
file-format = { workspace = true, optional = true }
jpeg-encoder = { version = "0.6", optional = true }
memmap2 = { version = "0.9.10", optional = true }
num-rational = { workspace = true, optional = true }
thumbhash = { version = "0.1.0", optional = true }
tokio = { workspace = true, optional = true }
# Sole logging facade (the `log` crate is forbidden in new code; see the Dependencies doc).
# Non-optional: the native library/import/lifecycle surface instruments hot-path spans and
# events, and the WASM sealing build links only the facade (no subscriber), which is free.
tracing = { workspace = true }
zune-core = { version = "0.5.1", optional = true }
zune-jpeg = { version = "0.5.15", optional = true }

# ── FFI (optional; `ffi` feature) ──────────────────────────────────────────
# uniffi proc-macro bindings for Kotlin/Swift. Optional so the default library
# build (CLI, server, tests) never compiles it.
uniffi = { version = "0.31", optional = true }

# ── TPM (optional; `tpm` feature) — desktop reference HardwareSigner ─────────
# RustCrypto-adjacent bindings to the TPM 2.0 Enhanced System API (links system
# `libtss2`). Optional + off by default so neither the default nor the mobile FFI
# build pulls in the TPM stack. See `crypto::keys::tpm`.
tss-esapi = { version = "7", optional = true }

# On wasm32 the OS CSPRNG has no default backend. `crypto::rng` uses getrandom 0.3 directly
# (Web Crypto via the `wasm_js` feature + `--cfg getrandom_backend="wasm_js"`, set for this
# target in `.cargo/config.toml`). The crypto stack (via `rand_core 0.6`) also pulls
# getrandom 0.2 transitively, whose wasm backend is its `js` feature — enabled here so the
# whole graph links. Neither is used on any other target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# `uuid` also needs an explicit wasm randomness source; route it through getrandom (whose
# wasm backend is configured above) so the drop id / file-id draws work in the browser.
uuid = { workspace = true, features = ["rng-getrandom"] }

[[example]]
name = "extract_metadata"
required-features = ["media"]

[[example]]
name = "generate_derivative"
required-features = ["media"]

[[example]]
name = "generate_lqip"
required-features = ["media"]

[dev-dependencies]
tempfile = "3"
# Integration tests (e.g. the S-D14 placement audit) build UUIDs to exercise the `library::paths`
# surface; `uuid` is a normal dependency, so the test crate needs its own dev-dependency on it.
uuid = { workspace = true }
