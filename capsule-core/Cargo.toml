[package]
name = "capsule-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A plain rlib. capsule-core exports no uniffi namespace of its own: the apps reach it through
# `capsule-sdk`'s `capsule_sdk` namespace (cdylib for Android, staticlib via the
# `capsule-core-ffi` umbrella for Apple), which links this crate like any other dependent
# (ADR-0005).

[features]
# `native` (default) is the surface the on-device library (`capsule-library`) builds on: the
# sidecar, CRDT, import, ML and notification logic, OpenMLS and the media stack. It holds no
# local state — that is `capsule-library`'s (Module Map — Stateless Core). Turning it OFF
# (`--no-default-features`) leaves only the WASM sealing surface (`cbor` + `crypto` + `drop`),
# which targets `wasm32-unknown-unknown` for the guest web-upload client (see
# `drop::seal_drop`). Build:
#   cargo build -p capsule-core --target wasm32-unknown-unknown --no-default-features
default = ["native"]
native = ["mls", "media"]
# `media` links the still-image decode/encode stack (`capsule_core::media`)
# over `rawshift-image`. Implied by `native`, so the CLI, the tests and the mobile FFI all carry
# decoders; **excluded** from the `wasm32-unknown-unknown` sealing build (`--no-default-features`),
# to which the whole stack is irrelevant. Every enabled codec is pure Rust and links no C, which
# is what keeps the mobile cross-builds working — see the dependency's own comment for why WebP
# is not among them. `capsule_core::lqip` stays unconditional and is NOT behind this feature — a
# placeholder must not depend on which client imported the photo.
media = ["dep:rawshift-image"]
# `media-linked-codecs` adds the two still **encoders** that link native code, and is therefore
# **opt-in and never in `default`** (issue #437). `default` (via `native`) is what the mobile FFI
# and every `rust-cross` target build, so keeping these out of it is what keeps those builds pure
# Rust. `capsule-cli` enables it — the stabilize-first consumer that runs on real libraries.
#
# - `jxl-encode-libjxl-vendored` — the **lossy** JXL master: the reference C++ libjxl, built from
#   the `jpegxl-src` crate's vendored tree by cmake and bound by bindgen (so the build host needs
#   cmake, a C++17 compiler and libclang). Replaces the lossless `zune-jpegxl` encode, so the tier
#   table's q=50 / q=70 finally reach the codec. Vendored rather than system libjxl because no
#   build host Capsule targets ships one reliably and a pkg-config miss would be a silent build
#   break on a fresh machine. libjxl and its bundled highway, brotli and skcms are BSD-3 / MIT /
#   Apache-2.0: attribution-only.
# - `avif-encode-ravif` — the AVIF delivery variant via `ravif` -> rav1e. rav1e's default `asm`
#   feature stays on (a transitive default cannot be turned off from here, and it is the fast
#   path), so every **x86_64** build host needs `nasm` on PATH; aarch64 assembles with the C
#   compiler. CI installs nasm for every job that builds `capsule-cli`.
#
# With both on, the preview tier is generated too (`media::DerivativeTier::GENERATED`): a
# source-resolution still is only worth its bytes in a lossy codec.
#
# HEIC decode is **not** here and cannot be by policy rather than toolchain: libheif and its HEVC
# decoder libde265 are both LGPL-3.0, which CLAUDE.md and `deny.toml` exclude outright (issue
# #588; the decision is recorded in the Dependencies design doc). AVIF decode is its own feature,
# `media-avif-decode`, below.
media-linked-codecs = [
    "media",
    "rawshift-image/jxl-encode-libjxl-vendored",
    "rawshift-image/avif-encode-ravif",
]
# `media-avif-decode` adds the AVIF still **decoder** (issue #588): `rawshift-image`'s
# `avif-decode-image`, which is `image` 0.25's `avif-native` — `mp4parse` (MPL-2.0) for the
# container and `dav1d` for the AV1 bitstream. `dav1d-sys` links a **system** libdav1d (BSD-2)
# through pkg-config and has no vendored build, so the build host needs `libdav1d-dev` (Debian /
# Ubuntu), `dav1d` (Homebrew) or `libdav1d-devel` (Fedora), and the binary links it dynamically.
# **Opt-in and never in `default`**, for the same reason as `media-linked-codecs`: `default` is
# what the mobile FFI and every `rust-cross` target build, and a pkg-config dependency on a
# cross-compiled C library is exactly what those builds must not grow. A separate feature rather
# than a third arm of `media-linked-codecs`, because the two need different build hosts (cmake +
# nasm versus a system library) and a caller may want one without the other. `capsule-cli`
# enables it on every host but Windows. `dep:dav1d` and `dep:mp4parse` are the same two crates
# `image` already links, named directly so `media::decode` can bound every AV1 frame with
# dav1d's own `frame_size_limit` before `image` (which sets none) decodes it.
media-avif-decode = ["media", "rawshift-image/avif-decode-image", "dep:dav1d", "dep:mp4parse"]
# `mls` links the live OpenMLS group backend (`crypto::authority::OpenMlsAuthority`)
# pinned to the X-Wing PQ ciphersuite `MLS_256_XWING_CHACHA20POLY1305_SHA256_Ed25519`
# (`0x004D`) via its formally-verified libcrux provider. Implied by `native` so the default
# library build (CLI, FFI, tests) exercises it; **excluded** from the `wasm32-unknown-unknown`
# sealing build (`--no-default-features`) because the libcrux provider does not target wasm32.
# The offline `ReferenceAuthority` stays available on every build regardless of this feature.
mls = [
    "dep:openmls",
    "dep:openmls_traits",
    "dep:openmls_libcrux_crypto",
    "dep:openmls_basic_credential",
    "dep:openmls_memory_storage",
]
# `test-support` exposes the entry points that let a caller choose the backup artifact's Argon2id
# wrap cost (`backup::export_with_params`, `backup::export_with_salt_and_params`; the Workspace
# verb over them is `capsule-library`'s `test-support`). **Never in `default`, and never in a
# shipping manifest.** A weak cost there produces a brute-forceable backup and nothing downstream
# re-checks it — `pwkdf::derive_wrap_key` accepts anything `argon2::Params::new` validates — so
# the ability to ask for one is a compile-time capability a reviewer can see in a manifest diff,
# not a documented convention. `capsule-core`'s own tests reach the same items through
# `cfg(test)`; a downstream test crate enables this on a **dev**-dependency, which resolver 3
# keeps out of every build that is not building tests. Enables no dependency and changes no
# production code path.
test-support = []
# `inference` gates the real per-platform model runners behind the `ml::ModelRunner` seam
# (`ml/runner.rs`, `ml/orchestrator.rs`). It is **empty today and enables nothing** — that is
# deliberate rather than an oversight. Four doc comments already describe the runners as riding a
# "default-off, weight-fetching `inference` feature", and until this line existed that sentence
# was simply untrue: `--features inference` was a hard cargo error, so the seam it names could not
# be gated on even to test the claim. Declaring it makes the documentation honest and gives the
# post-v1 CLIP runner something to attach to without a manifest change in the same commit as the
# implementation. Nothing in the tree is `#[cfg(feature = "inference")]` yet; the first real runner
# adds both the cfg and the `dep:` entries here. No model weights ship in git regardless.
inference = []

[dependencies]
ciborium = "0.2"
half = "2"               # IEEE-754 f16 for RFC 8949 §4.2 shortest-float canonical CBOR
globset = "0.4.18"
# The LQIP placeholder codec (SSoT: Thumbnails — LQIP). **Not optional and not
# feature-gated**: `capsule_core::lqip` is linked identically by the CLI, the app FFI and
# `capsule-wasm`, so a photo's placeholder never depends on which client imported it. Safe to
# keep unconditional because chromahash has zero runtime dependencies and builds for
# `wasm32-unknown-unknown` (it ships a `simd128` backend alongside AVX2/SSE2 and NEON).
# `default-features = false` drops `spec-vectors`, which only compiles the crate's own
# integration test; `simd` is kept because every backend replays the scalar path op-for-op
# and is byte-identical — it changes speed, never output. Imported **directly** rather than
# through Rawshift, which AGENTS.md forbids from wrapping it.
chromahash = { version = "0.7.1", default-features = false, features = ["simd"] }
indexmap = { workspace = true }
jiff = { workspace = true }
kamadak-exif = "0.5"
# Still-image decode/encode for `capsule_core::media` (`media` feature). A **registry**
# dependency, not the pinned `rawshift/` submodule, which is an uninitialised newer
# v1-in-progress tree and is not a workspace member. Depended on directly rather than through
# the `rawshift` facade because only the per-crate dependency gives per-format Cargo control
# (`rawshift-image`'s own docs say so), and the format set is a licence, build-host and
# *portability* decision:
#
# - `jpeg-decode` / `png-decode` — pure-Rust zune decode for the two formats every library holds.
#                     **Decode only in the shipping graph.** Their encoders exist and only the
#                     test fixtures use them, so they ride `[dev-dependencies]` below: shipping
#                     `jpeg-encode` would put `jpeg-encoder` — and its conjunctive IJG licence
#                     arm, which cannot be elected away — into every release binary to satisfy
#                     nothing a user does.
# - `jxl`           — jxl-oxide decode plus the `zune-jpegxl` encoder that produces the thumbnail
#                     tier. Pure Rust, and `image/jxl` is the tier table's committed *master*
#                     format. The backend is `JxlSimpleEncoder`, which is lossless — a thumbnail
#                     therefore costs more bytes than the table's q=50 intends. The lossy libjxl
#                     backend is the opt-in `media-linked-codecs` feature above; `jxl` stays on
#                     for the jxl-oxide decoder either way.
# - `tiff-decode` / `gif-decode` — pure Rust, no encoder needed.
# - `arw-decode` / `dng-decode` — the two RAW families upstream calls `raw-stabilizing` (issue
#                     #589), decoded through `RawFile::open(..).process(..)`: rawshift's own TIFF
#                     parser (`binrw`, MIT) plus its lossless-JPEG and JXL tile decoders. Pure
#                     Rust. **Decode only**: the `arw` / `dng` umbrellas would add `dng-encode`,
#                     which nothing a user does needs and which the fixtures do not use either —
#                     they are written with the parser's own `tiff::TiffWriter`, because
#                     `export_dng` writes a photometric-RGB IFD that `dng-decode` cannot read back.
#
# **`webp` is deliberately absent, and it is not a preference.** It does not compile for any
# aarch64 target: `codecs/webp.rs:164,177,190` pass `b"EXIF".as_ptr() as *const i8` to
# `WebPMuxSetChunk`, whose `libwebp-sys` 0.14.4 signature (`ffi.rs:881`) takes
# `*const core::ffi::c_char` — and `c_char` is `u8` on aarch64, so the cast is an E0308. That
# module is compiled under `any(webp-decode, webp-encode)`, so decode-only does not escape it.
# Every mobile target Capsule ships is aarch64, so WebP is a recognised-but-undecodable format
# here until upstream fixes the cast.
#
# Also absent: `heic` (libheif + libde265, both LGPL-3.0), AVIF *decode* (image's `avif-native` ->
# system libdav1d), AVIF *encode* and lossy JXL by default (both in `media-linked-codecs`), `svg`, and the
# other five RAW families (`raw-incomplete`: CR2, CR3, CRW, NEF, RAF; CR3 pixel decode is
# unimplemented upstream). Each is a typed
# `media::MediaError::UnsupportedFormat` today rather than a silent gap. MPL-2.0, already
# allow-listed in `deny.toml`; see the Media row in design/dependencies.md.
#
# Video is absent too. It waits on `rawshift-video`, which is still an unimplemented
# placeholder at 0.1.1, and Capsule links no video codec of its own (design/licensing.md, "The
# video transcoder seam").
rawshift-image = { version = "0.1.1", default-features = false, features = [
    "jpeg-decode",
    "png-decode",
    "jxl",
    "tiff-decode",
    "gif-decode",
    "arw-decode",
    "dng-decode",
], optional = true }
# The AVIF frame-size pre-flight (`media-avif-decode` only): the versions `image` 0.25's
# `avif-native` already resolves, so the graph gains no crate. See `media::decode`.
dav1d = { version = "0.11.1", optional = true }
mp4parse = { version = "0.17.0", optional = true }
serde = { workspace = true }
serde_bytes = "0.11"     # CBOR byte-string (de)serialization for keys/signatures
serde_json = { workspace = true }
thiserror = { workspace = true }
tzf-rs = "0.4"
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
sha2 = { workspace = true }
hex = { workspace = true }

# ── Cryptography (data plane) ──────────────────────────────────────────────
# Pin the STABLE RustCrypto line: aes-gcm 0.11 / aead 0.6 deleted the STREAM module.
aes-gcm = { version = "0.10", features = ["aes"] }
aead = { version = "0.5", features = ["stream", "alloc"] }
hkdf = "0.12"
hmac = "0.12"
sha3 = "0.10"            # SHA3-256 combiner + SHAKE256 seed expansion for the X-Wing KEM
argon2 = { workspace = true }
ed25519-dalek = "2"
# RustCrypto NIST P-256 ECDSA + ECDH — the classical half of the hardware-backed hybrid device
# keys (Secure Enclave / StrongBox / TPM expose P-256, not Ed25519/X25519). `ecdsa` backs the
# hybrid DSK (`crypto::keys::p256`); `ecdh` backs the hybrid DEK's hardware-bound classical half
# (`crypto::keys::kem_p256`). Already in the workspace tree via `jsonwebtoken`; the
# software `p256` element is the reference/mock a real secure element replaces. DER ECDSA over
# SHA-256 — `default-features = false` drops the unused `pem`/`pkcs8`/`std` surface.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
ml-dsa = "0.1"            # RustCrypto FIPS-204 (ML-DSA-65) — the PQ signature half
ml-kem = "0.3"           # RustCrypto FIPS-203 (ML-KEM-768) — PQ half of the X-Wing device KEM
x25519-dalek = "2"       # RustCrypto X25519 — classical half of the X-Wing device KEM
getrandom = "0.3"        # OS CSPRNG for keys, salts, nonce prefixes
tar = "0.4"              # deterministic uncompressed POSIX tar backup container
# Shamir secret sharing (opt-in 2-of-3 recovery). The maintained `sharks` fork with uniform
# polynomial coefficients (RUSTSEC-2024-0398 fix) and the same share encoding; `sharks` is retired.
blahaj = "0.7"

# Sole logging facade (the `log` crate is forbidden in new code; see the Dependencies doc).
# Non-optional: the native library/import/lifecycle surface instruments hot-path spans and
# events, and the WASM sealing build links only the facade (no subscriber), which is free.
tracing = { workspace = true }

# ── MLS group layer (optional; `mls` feature, implied by `native`) ──────────
# RFC 9420 MLS backing the live `OpenMlsAuthority`, pinned to the X-Wing PQ ciphersuite
# `MLS_256_XWING_CHACHA20POLY1305_SHA256_Ed25519` (`0x004D`). The `libcrux-provider` feature
# wires OpenMLS to Cryspen's formally-verified libcrux crypto — the only released provider
# shipping the X-Wing suite. `openmls_libcrux_crypto` is that provider; `openmls_basic_credential`
# supplies the leaf `SignatureKeyPair`; `openmls_traits` exposes the `Ciphersuite` type. All four
# are host-only (libcrux does not target `wasm32-unknown-unknown`), so they sit behind `mls`,
# which `native` implies and the wasm sealing build excludes. See `crypto::authority::openmls`.
# From 0.9 the X-Wing suite sits behind `draft-ietf-mls-pq-ciphersuites`. It is enabled on the
# four leaf crates, not on `openmls`: openmls's own feature names `openmls_sqlite_storage?/…`, and
# Cargo's resolver then pulls that optional crate's rusqlite 0.37 into the `links = "sqlite3"`
# check, where it conflicts with `capsule-library`'s rusqlite 0.32. openmls's feature only adds the PQ
# suites to its *default* leaf capabilities, which `openmls_authority::pinned_capabilities` sets
# explicitly instead.
openmls = { version = "0.9.1", default-features = false, features = [
    "libcrux-provider",
], optional = true }
openmls_traits = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"], optional = true }
openmls_libcrux_crypto = { version = "0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"], optional = true }
openmls_basic_credential = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"], optional = true }
# The OpenMLS storage provider Capsule owns (rather than the libcrux provider's private one), so
# durable group state serializes for `OpenMlsAuthority::export_state`/`import_state`.
# Same version the libcrux provider already pulls transitively; host-only alongside the rest of `mls`.
openmls_memory_storage = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"], optional = true }

# NFC for user labels (`sidecar::normalize_label`; Organization — Labels): one normalizer for
# asset, region, stack and album labels, so a label typed on two platforms is one label. Pure
# Rust, no dependencies of its own beyond `tinyvec`, already in the lock file transitively.
unicode-normalization = "0.1.25"

# On wasm32 the OS CSPRNG has no default backend. `crypto::rng` uses getrandom 0.3 directly
# (Web Crypto via the `wasm_js` feature + `--cfg getrandom_backend="wasm_js"`, set for this
# target in `.cargo/config.toml`). The crypto stack (via `rand_core 0.6`) also pulls
# getrandom 0.2 transitively, whose wasm backend is its `js` feature — enabled here so the
# whole graph links. Neither is used on any other target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# `uuid` also needs an explicit wasm randomness source; route it through getrandom (whose
# wasm backend is configured above) so the drop id / file-id draws work in the browser.
uuid = { workspace = true, features = ["rng-getrandom"] }

[dev-dependencies]
# Property tests for the CRDT merge laws and the canonical codecs, per the testing plan. The pin
# and its feature set live in the root `[workspace.dependencies]`.
proptest = { workspace = true }
# The encoders the fixtures need and the shipping graph does not. Cargo unifies features per
# build, so a `cargo build` links decode only while `cargo test` gets the encoders — which keeps
# `jpeg-encoder`'s IJG arm out of every release binary while leaving it in the graph
# `cargo deny --all-features` inspects, so its `deny.toml` exception and NOTICE section stay
# matched rather than becoming stale. The `media` feature is named explicitly because a
# dev-dependency does not inherit the optional dependency's gate.
rawshift-image = { version = "0.1.1", default-features = false, features = [
    "jpeg",
    "png",
] }
