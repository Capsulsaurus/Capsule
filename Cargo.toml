[workspace]
members = [
    "capsule-cli",
    "capsule-cli/entity",
    "capsule-cli/migration",
    "capsule-core",
    "capsule-core-ffi",
    "capsule-e2e",
    "capsule-i18n",
    "capsule-library",
    "capsule-sdk",
    "capsule-wasm",
    "capsule-server",
    "capsule-server/migration",
    "ptpip-rs",
    "xtask",
]
# capsule-sdk's REST client is generated at build time by spargen from the committed
# capsule-server/openapi.json; regenerate it with `mise run openapi-kynos`.
default-members = [
    "capsule-cli",
    "capsule-cli/entity",
    "capsule-cli/migration",
    "capsule-core",
    "capsule-core-ffi",
    "capsule-e2e",
    "capsule-i18n",
    "capsule-library",
    "capsule-sdk",
    "capsule-server",
    "capsule-server/migration",
    "ptpip-rs",
]
resolver = "3"
# The cargo-fuzz harness is its own workspace: it links libFuzzer and is built only by
# `cargo fuzz` (or `mise run fuzz-check`), never by a workspace build or test run.
exclude = ["capsule-core/fuzz", "capsule-server/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
# AGPL-3.0-only, deliberately not -or-later: "or later" would let a future FSF
# revision restate Capsule's own outbound grant, and the copyright holder keeps
# sole control of those terms. Members inherit this with `license.workspace = true`.
license = "AGPL-3.0-only"
authors = ["Justin Chung <20733699+justin13888@users.noreply.github.com>"]
repository = "https://github.com/Capsulsaurus/Capsule"

[workspace.dependencies]
argon2 = "0.5.3"
# RFC 6238 time-based one-time passwords — the second factor of the local auth path
# (design/authentication.md). `otpauth` emits the `otpauth://` provisioning URI
# every authenticator app scans; `gen_secret` generates the shared secret. Promoted to a
# workspace dependency here so the rebuilt server and the retiring `capsule-api/auth` cannot
# drift to two versions of the same algorithm during the changeover.
totp-rs = { version = "5.7.1", features = ["gen_secret", "otpauth"] }
# Constant-time equality. Already in the tree under `aes-gcm`; promoted to a direct dependency
# so the one place this codebase compares a secret-derived value byte for byte — the second
# factor's code check — does not hand-roll the fold the optimizer is free to short-circuit.
subtle = "2.6.1"
# Kynos — the REST/OpenAPI server framework the `capsule-api` rebuild targets. Consumed from
# crates.io: it published 0.1.0 on 2026-08-29, which discharges the repin-on-publish exit the
# dependencies doc recorded while it was a git dependency. `openapi32` is a strict, purely
# additive superset of the default `openapi31`, and Capsule emits a 3.2 document — see the
# OpenAPI row in design/dependencies.md.
kynos = { version = "0.4.0", features = ["openapi32"] }
base64 = "0.22.1"
bb8 = "0.9.1"
bb8-redis = "0.26.0"
bytes = "1.12.1"
# Reading a response body back to bytes, for the coded-problem interceptor.
# `http-body-util` is already in the lock file — Kynos and hyper both depend on it — and it is
# the canonical adapter crate for the `http-body` trait rather than a new domain. See the
# HTTP body row in design/dependencies.md.
http-body-util = "0.1.3"
# The `http` types reqwest is built on, for the SDK's reactive refresh layer alone: it reads a
# `401`'s problem code to decide whether the response is an expired token, then puts the body
# back, and `reqwest::Response`'s only constructor is `From<http::Response<_>>`. Already in the
# lock file through reqwest and hyper. See the HTTP types row in design/dependencies.md.
http = "1.4.2"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "2"
eyre = "0.6.12"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
nanoid = "0.4.0"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
# The HTTP client. `capsule-sdk` is the sanctioned client network path and `capsule-server`'s
# OIDC relying party is the one server egress: discovery, JWKS and the token
# exchange against an identity provider. rustls only, per the TLS row in design/dependencies.md;
# `json` for the provider's documents. The SDK enables `stream` and `multipart` on top.
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
ring = "0.17.14"
sea-orm = { version = "2.0.4" }
sea-orm-migration = { version = "2.0.4", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
testcontainers = "0.27.3"
# Property tests (dev-dependency only), per the testing plan: core codecs and CRDT laws in
# capsule-core, upload fault schedules in capsule-sdk. `std` only: the `fork`/`timeout` runners
# and the `bit-set` strategies are unused, and `bit-set` would drag a newer `borsh` through the
# lock file.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Snapshot assertions (dev-dependency only) for the CLI's `--json` and exit-code contract. No
# default features: `colors` only tints a local diff, and the snapshots are plain strings.
insta = { version = "1.48.0", default-features = false }
# The CLI's full-screen TUI (Terminal UI row in design/dependencies.md). No default features:
# `widget-calendar` pulls the `time` crate, and jiff is the datetime crate. crossterm is pinned
# to the backend version ratatui is built against so the graph holds one copy; `event-stream`
# gives the TUI loop an async input stream.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
testcontainers-modules = { version = "0.15.0", features = [
    "postgres",
    "redis",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.3", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"
# Build tooling only: xtask's README screenshot pipeline (seed normalization + compositing).
# Product media decoding stays with Rawshift — see the "Tooling image processing" row in
# design/dependencies.md.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# `panic` stays at its default, `unwind`, in every profile: `capsule-core::media::decode::guarded`
# catches a panicking third-party codec with `catch_unwind` so the original still imports. Under
# `abort` that panic would take down the whole server or app instead.
[profile.release]
lto = "thin"
codegen-units = 1

# An optimized build a sampling profiler can symbolize (`cargo build --profile profiling`).
# It keeps release's LTO and codegen units, because loosening them changes inlining and so
# measures code we do not ship. Line tables carry the file:line and inlined-frame information
# that a profiler reads; full DWARF would only add variable info, which a sampler never uses.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Debug info dominates `target/debug` (12 GB with full DWARF on this workspace), which caps
# how many concurrent worktrees fit on a dev machine. Line tables keep `file:line` in every
# workspace backtrace frame and panic — what we actually read day to day — while dropping the
# variable-level DWARF only a step debugger uses. `unpacked` leaves the remainder in per-object
# files rather than copying it into every binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
# Incremental is on: the edit-rebuild loop is worth more than the disk it costs. These numbers,
# measured on 2026-10-29, replace the 8.1–8.5 GB of `target/debug/incremental` per worktree
# that dcc47337 recorded, a figure that did not say whether tests were built. A one-line edit in
# capsule-core rebuilds in 11–16s instead of 30–37s for `cargo build --workspace`, and in
# 25–35s instead of 54–62s for `cargo test --workspace --no-run`. In exchange the cache is
# 2.7 GB after a workspace build and 13 GB once the test targets are built too. A worktree's
# target grows from 5.6 to 8.4 GB when it only builds, and from 19–20 to 31–32 GB when it also
# builds tests. Incremental applies only to workspace crates, so the dependency setting below
# does not shrink this cache.
# `profile.test` must match: with dev on and test off, the workspace crates both profiles share
# are rebuilt every time you switch between `cargo build` and `cargo test` (10–66s with no edit).
# On a machine short of disk, turn both off together for that shell:
# `CARGO_PROFILE_DEV_INCREMENTAL=false CARGO_PROFILE_TEST_INCREMENTAL=false`
# (or `CARGO_INCREMENTAL=0`, which overrides both profiles).
incremental = true

# Dependencies get no debug info at all, which trims their objects and every linked binary.
# Workspace crates keep `line-tables-only` (above), so their backtrace frames still show
# `file:line`. Most dependency frames keep their symbol names but lose `file:line`. A panic
# raised inside a dependency still reports its location, which does not come from debug info.
# `profile.test` inherits this block. To step through a dependency, override it for one build:
# `cargo --config 'profile.dev.package."*".debug=2' build`. `CARGO_PROFILE_DEV_DEBUG=2` affects
# only the workspace crates, and only under `cargo build`, because `profile.test` sets its own
# `debug`. Tests take `CARGO_PROFILE_TEST_DEBUG=2`.
[profile.dev.package."*"]
debug = false

# xtask's screenshot pipeline decodes and Lanczos-resizes ~40 multi-megapixel photos and blurs a
# 1.5k×3k canvas; unoptimized, that takes minutes instead of seconds. Only build tooling depends
# on these crates, so optimizing them costs nothing elsewhere.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
# The AV1 encoder behind capsule-core's `media-linked-codecs` AVIF variant (#437). Unoptimized,
# rav1e takes about ten seconds per small frame, which every media test that generates
# derivatives pays. It is a leaf codec, so optimizing it changes nothing else's build.
[profile.dev.package.rav1e]
opt-level = 3

# The same settings for the test profile, spelled out rather than inherited.
#
# `profile.test` inherits `debug` from `dev` and does **not** inherit `split-debuginfo`, so every
# test binary was linked `packed` — a `.dSYM` bundle per binary, on top of the same DWARF already
# in the per-object files. Measured at 6.7 GB of pure duplication across this workspace's test
# binaries, which is enough to fill a dev machine's disk mid-run and fail a link with `errno=28`.
# The reasoning above applies unchanged; only the inheritance did not.
#
# `incremental` must equal `profile.dev`'s (see the note there): when the two differ, every
# switch between `cargo build` and `cargo test` rebuilds the workspace crates both use.
# `[profile.dev.package."*"]` needs no copy here: test builds inherit it, so dependencies get
# no debug info in tests either.
[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
