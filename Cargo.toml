[workspace]
members = [
    "capsule-api",
    "capsule-api/auth",
    "capsule-api/media",
    "capsule-api/service",
    "capsule-api/entity",
    "capsule-api/environment",
    "capsule-api/sync",
    "capsule-api/migration",
    "capsule-api/model",
    "capsule-api/testing",
    "capsule-api/upload",
    "capsule-cli",
    "capsule-cli/entity",
    "capsule-cli/migration",
    "capsule-core",
    "capsule-core-ffi",
    "capsule-i18n",
    "capsule-sdk",
    "capsule-wasm",
    "capsule-server",
    "capsule-wire",
    "xtask",
]
# capsule-sdk's REST client is generated at build time by spargen from the committed
# capsule-sdk/openapi.json (slice S-D8); regenerate the schema with `mise run openapi`.
default-members = [
    "capsule-api",
    "capsule-api/auth",
    "capsule-api/media",
    "capsule-api/service",
    "capsule-api/entity",
    "capsule-api/environment",
    "capsule-api/sync",
    "capsule-api/migration",
    "capsule-api/model",
    "capsule-api/testing",
    "capsule-api/upload",
    "capsule-cli",
    "capsule-cli/entity",
    "capsule-cli/migration",
    "capsule-core",
    "capsule-core-ffi",
    "capsule-i18n",
    "capsule-server",
    "capsule-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
# AGPL-3.0-only, deliberately not -or-later: "or later" would let a future FSF
# revision restate Capsule's own outbound grant, and the copyright holder keeps
# sole control of those terms. Members inherit this with `license.workspace = true`.
license = "AGPL-3.0-only"
authors = ["Justin Chung <20733699+justin13888@users.noreply.github.com>"]
repository = "https://github.com/Capsulsaurus/Capsule"

[workspace.dependencies]
argon2 = "0.5.3"
# RFC 6238 time-based one-time passwords — the second factor of the local auth path
# (design/authentication.md, slice `S-C55`). `otpauth` emits the `otpauth://` provisioning URI
# every authenticator app scans; `gen_secret` generates the shared secret. Promoted to a
# workspace dependency here so the rebuilt server and the retiring `capsule-api/auth` cannot
# drift to two versions of the same algorithm during the changeover.
totp-rs = { version = "5.7.1", features = ["gen_secret", "otpauth"] }
# Constant-time equality. Already in the tree under `aes-gcm`; promoted to a direct dependency
# so the one place this codebase compares a secret-derived value byte for byte — the second
# factor's code check — does not hand-roll the fold the optimizer is free to short-circuit.
subtle = "2.6.1"
# Kynos — the REST/OpenAPI server framework the `capsule-api` rebuild targets. Consumed from
# crates.io: it published 0.1.0 on 2026-08-29, which discharges the repin-on-publish exit the
# dependencies doc recorded while it was a git dependency. `openapi32` is a strict, purely
# additive superset of the default `openapi31`, and Capsule emits a 3.2 document — see the
# OpenAPI row in design/dependencies.md.
kynos = { version = "0.1.0", features = ["openapi32"] }
base64 = "0.22.1"
bb8 = "0.9.1"
bb8-redis = "0.26.0"
bytes = "1.12.1"
# Reading a response body back to bytes, for the coded-problem interceptor (slice `S-C36`).
# `http-body-util` is already in the lock file — Kynos and hyper both depend on it — and it is
# the canonical adapter crate for the `http-body` trait rather than a new domain. See the
# HTTP body row in design/dependencies.md.
http-body-util = "0.1.3"
chrono = { version = "0.4.45", features = ["serde"] }
data-encoding = "2.11.0"
derive_more = "2.1.1"
ed25519-dalek = "2"
eyre = "0.6.12"
futures-util = "0.3.32"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
file-format = "0.28"
nanoid = "0.4.0"
num-rational = { version = "0.4.2", features = ["serde"] }
prost = "0.14.4"
prost-types = "0.14.4"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
ring = "0.17.14"
salvo = { version = "0.86.0", features = [
    "oapi",
    "cors",
    "server",
    "http2",
    "http2-cleartext",
    "tower-compat",
    "test",
    "affix-state",
] }
sea-orm = { version = "1.1.20" }
sea-orm-migration = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
testcontainers = "0.26.3"
testcontainers-modules = { version = "0.14.0", features = [
    "postgres",
    "redis",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-types = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6" }
uuid = { version = "1.23.3", features = ["v4"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

# Debug info dominates `target/debug` (12 GB with full DWARF on this workspace), which caps
# how many concurrent worktrees fit on a dev machine. Line tables keep `file:line` in every
# backtrace and panic — what we actually read day to day — while dropping the variable-level
# DWARF only a step debugger uses. `unpacked` leaves the remainder in per-object files rather
# than copying it into every binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
# Incremental caches cost far more than they save here: measured 8.5 GB in one worktree and
# 6.8 GB in another, against a ~90s cold workspace build. With several worktrees in flight
# that is the difference between building and running out of disk. Full builds it is.
incremental = false

# The same settings for the test profile, spelled out rather than inherited.
#
# `profile.test` inherits `debug` from `dev` and does **not** inherit `split-debuginfo`, so every
# test binary was linked `packed` — a `.dSYM` bundle per binary, on top of the same DWARF already
# in the per-object files. Measured at 6.7 GB of pure duplication across this workspace's test
# binaries, which is enough to fill a dev machine's disk mid-run and fail a link with `errno=28`.
# The reasoning above applies unchanged; only the inheritance did not.
[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
