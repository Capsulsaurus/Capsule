[workspace]
members = [
    "capsule-cli",
    "capsule-cli/entity",
    "capsule-cli/migration",
    "capsule-core",
    "capsule-core-ffi",
    "capsule-i18n",
    "capsule-media",
    "capsule-sdk",
    "xtask",
]
default-members = [
    "capsule-cli",
    "capsule-cli/entity",
    "capsule-cli/migration",
    "capsule-core",
    "capsule-core-ffi",
    "capsule-i18n",
    "capsule-media",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
argon2 = "0.5.3"
base64 = "0.22.1"
bytes = "1.11"
chrono = { version = "0.4.45", features = ["serde"] }
data-encoding = "2.11.0"
derive_more = "2.1.1"
eyre = "0.6.12"
futures-util = "0.3.32"
indexmap = { version = "2.14.0", features = ["serde"] }
log = { version = "0.4.32", features = ["release_max_level_debug"] }
file-format = "0.28"
nanoid = "0.4.0"
num-rational = { version = "0.4.2", features = ["serde"] }
sea-orm = { version = "1.1.20" }
sea-orm-migration = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.3", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
