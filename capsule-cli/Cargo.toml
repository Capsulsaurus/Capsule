[package]
name = "capsule-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "capsule"
path = "src/main.rs"

# The command-tree description artifact the documentation site is generated from (slice
# `S-Z8`). Declared explicitly rather than left to autodiscovery so the crate's two binaries
# are visible in one place: `capsule` ships, this one only ever runs from `mise run
# cli-surface` / `cli-surface-check`.
[[bin]]
name = "gen_cli_surface"
path = "src/bin/gen_cli_surface.rs"

[lib]
name = "capsule_cli"
path = "src/lib.rs"

[dependencies]
capsule-cli-entity = { path = "./entity" }
capsule-cli-migration = { path = "./migration" }
# `media-linked-codecs`: the lossy libjxl master, the AVIF delivery variant and the preview tier
# (issue #437). The CLI is the stabilize-first client that imports real libraries, and it builds
# only for desktop hosts, so it takes the native-code encoders the mobile FFI deliberately does
# not. Building it needs cmake, a C++17 compiler, libclang and — on x86_64 — nasm.
capsule-core = { path = "../capsule-core", features = ["media-linked-codecs"] }
# The CLI is a client: every network flow (auth login/refresh/logout, the sync
# feed) rides `capsule-sdk`, the sanctioned network path — the CLI never
# hand-rolls a request (S-D5). `capsule-i18n` supplies the localized user-facing
# strings; no output string is hardcoded in this crate's new surfaces.
capsule-sdk = { path = "../capsule-sdk" }
capsule-i18n = { path = "../capsule-i18n" }
secrecy = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# `capsule auth recover` reads a minted recovery secret, which is shown as hex (#544).
hex = { workspace = true }
capitalize = "0.3.4"
jiff = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
colored = "3.1.1"
dialoguer = "0.11.0"
directories = "6.0"
eyre = { workspace = true }
futures = "0.3.32"
humansize = "2.1"
indexmap = { workspace = true }
nanoid = "0.4.0"
sea-orm = { workspace = true, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "debug-print",
] }
serde = { workspace = true }
sysinfo = "0.36.1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true, features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "json",
    "fmt",
] }
# Asset ids on the `capsule cull` argument surface (S-D16). Already the workspace-wide
# identifier pin; the CLI simply needs to name and parse the type it prints.
uuid = { workspace = true }
# `capsule auth login --oidc` (S-N2): decoding the provider's redirect query on the loopback
# listener. Already in the graph under reqwest; named here so the listener does not hand-roll
# percent-decoding.
url = "2.5.8"
walkdir = "2.5.0"

# `media-avif-decode`: AVIF stills decode, so an AVIF original gets its dimensions, placeholder and
# thumbnail instead of a no-codec deferral (issue #588). It links a **system** libdav1d (BSD-2)
# through pkg-config, so the build host needs `libdav1d-dev` / `dav1d` and the binary needs the
# shared library at run time. Gated off Windows, which has no system package that ships libdav1d
# with a pkg-config file on the release runner, and which is a deferred platform tier: there an
# AVIF original is still recognised and deferred with a typed no-codec status, never silently
# skipped. Cargo unifies this with the unconditional dependency above.
[target.'cfg(not(windows))'.dependencies]
capsule-core = { path = "../capsule-core", features = ["media-avif-decode"] }
