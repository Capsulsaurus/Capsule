[package]
name = "capsule-core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "capsule_core_ffi"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
capsule-core = { path = "../capsule-core" }
capsule-library = { path = "../capsule-library" }
# The SDK's uniffi surface (`capsule_sdk` namespace: FfiCapsuleClient/FfiSession)
# rides in this staticlib so the app links ONE Rust library — two Rust staticlibs in one
# binary would each bundle their own std and collide at link time. capsule-core exports no
# namespace of its own, so this pair is the whole of what the app links (ADR-0005).
capsule-sdk = { path = "../capsule-sdk", features = ["ffi"] }
ciborium = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uniffi = { version = "0.31", features = ["cli"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
# Low-level `os_log` bindings only (`default-features = false` drops oslog's own `log`
# facade sink); the tracing → unified-logging bridge is a `tracing_subscriber` layer in
# `init_logging`, so we drive `OsLog` directly and never touch the `log` crate.
oslog = { version = "0.2", default-features = false }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
