[package]
name = "capsule-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Kynos REST/OpenAPI server that replaces the Salvo stack.
#
# It is `capsule-server` and not `capsule-api` only because the Salvo `capsule-api` is still a
# live workspace member while the rebuild reaches parity — retiring it first would leave the tree
# with no server, no CLI network commands and no end-to-end test for the duration. The rename is
# a `git mv` in the same change that moves the old tree into `legacy-review/`.
#
# One application, cohesive internal modules — not separate transports or services (see the
# crate docs in `src/lib.rs`).

# Kynos's route attribute generates a `relative_uri` doc comment whose prose is indented four
# spaces, which rustdoc reads as an indented Rust code block and then fails to parse. Every one
# of this crate's doctests is that generated block, so `cargo test -p capsule-server` is red for
# a reason no author here can fix. `cargo nextest` — what `mise run test-rust` runs — never
# collects doctests, so the gate was green while the plain command was not, which is the worst
# of the two states: a red command people learn to ignore.
#
# Turned off here rather than worked around, and revisited at the next Kynos repin: if the
# generated doc stops being indented, delete this and the doctests come back. Nothing is lost
# today because this crate has no doctest of its own.
[lib]
doctest = false

[features]
# The federation pull's loopback seam (`federation::pull::remote::test_egress`): a test routes a
# peer host to the TLS front it bound and trusts that front's private CA, so a pull dials
# `https://{peer}/` over a real handshake. Off by default and never on in a served build:
# `capsule-e2e` enables it from its dev-dependencies, so resolver 3 compiles it only into test
# targets. With nothing registered the client it builds is the production one.
test-egress = []

[dependencies]
# The framework. Pinned once in the root manifest, where its rationale sits.
kynos = { workspace = true }
# The shared, key-free validation invariants. The envelope gate does not
# reimplement invariants 1-8 and 15: `capsule_core::validation` owns them, the client's own
# `verify_asset` mirrors them, and a second implementation here would be a second answer to a
# question the threat model allows one answer to. `capsule_core::crypto::hash` comes with it,
# which is how finalization recomputes the ciphertext hash without this crate picking its own
# digest crate. A workspace member, already in the lock file through `capsule-api`, so this
# adds no external dependency. The `native` default is
# not optional: `validation` is gated behind it.
# `default-features = false`: the server needs only `capsule_core::validation` — the pure, key-less
# refuse-by-default invariants — and the crypto types they read. The default `native` feature pulls
# SQLite, sqlite-vec, OpenMLS and libcrux, none of which a key-free server touches.
capsule-core = { path = "../capsule-core", default-features = false }
serde = { workspace = true }
# The state ports. `thiserror` because these are a library surface;
# `jiff` because every record and every TTL is a time and chrono is banned; `tracing` because
# the ports are on the critical path of every authenticated request and every upload chunk;
# `uuid` so a session's asserted `device_id` is parsed once at the port boundary instead of
# being re-normalized as a string at each call site. All four are already workspace
# dependencies.
thiserror = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
# `v7` for the session ids this crate mints: a session id is a new identifier, and UUIDv7 is
# the default for one (design/metadata.md#identifiers). `v4` rides along
# from the workspace default.
uuid = { workspace = true, features = ["v7"] }
# The message catalog's stable `error.*` codes (the i18n design doc). Every
# rejection this server renders names one from `capsule_i18n::error_codes` rather than a string
# literal, so a typo is a compile error and the code cannot drift from `locales/`.
capsule-i18n = { path = "../capsule-i18n" }
# EdDSA access and refresh tokens. Already the workspace's JWT crate, pinned with `aws_lc_rs`
# in the root manifest. Nothing else in this crate parses a JWT.
jsonwebtoken = { workspace = true }
# The blob store's filesystem adapter. `tokio::fs` because every blob write is
# an await on a server runtime and `std::fs` on that runtime blocks it; `fs`/`io-util`/`rt` are
# the three features a ranged read and a durable append need, and nothing more. Already the
# workspace's async runtime and already in this
# crate's tree through kynos — this promotes it from a dev-dependency, it does not add a crate.
# `rt-multi-thread` and `macros` on top of those three for the binary: `serve` runs an accept
# loop that has to make progress while a request is awaiting the disk, and `#[tokio::main]` is
# the attribute that starts it. Kynos's `server` feature already unifies `net`/`signal`/`rt` in;
# these two are named here rather than relied on through it, so a Kynos feature change cannot
# silently take the binary's runtime away.
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "rt",
  "rt-multi-thread",
  "macros",
] }
# The `.reason.json` a quarantined blob keeps beside it (design/filesystem/server.md). The
# encoding belongs to the filesystem *adapter*, not to the port's record — which derives no
# serde traits, exactly as the state ports' records do not — so this is used in one file.
# Already a workspace dependency, and already here as a dev-dependency.
serde_json = { workspace = true }
# The sync cursor's HMAC-SHA256 (validation invariant 22). `ring` is already the
# workspace's key-generation crate and was already here as a dev-dependency; this promotes it.
# The alternative was the RustCrypto `hmac` + `sha2` pair, which would have put a second HMAC
# implementation in one binary for one 41-byte token.
ring = { workspace = true }
# base64url for that cursor, which is a query parameter and therefore has to survive a URL.
# Already a workspace dependency.
base64 = { workspace = true }
# The buffer type Kynos's `ByteSource` signature is written in, so ranged blob serving can hand
# back a span without a copy. Already in the lock file through `capsule-sdk` and `capsule-api`;
# no new external dependency and no new domain.
bytes = { workspace = true }
# The coded-problem interceptor reads a rendered problem body back before putting it
# down again, and `Body` is an `http_body::Body` with no inherent collector. Already in the lock
# file through Kynos and hyper.
http-body-util = { workspace = true }

# RFC 6238 second-factor codes. `otpauth` for the provisioning URI an
# authenticator app scans, `gen_secret` for the shared secret this server generates. SHA-1,
# six digits, 30 s step, one step of drift; replay refusal is the store's compare-and-set.
# Already in the lock file through the retired
# `capsule-api/auth`, which is where the four TOTP operations are being ported *from*.
totp-rs = { workspace = true }
# The constant-time comparison that check uses; already transitive.
subtle = { workspace = true }

# Argon2id for the development profile's account adapter (`auth::credential`,
# `auth::accounts_memory`). Already a workspace dependency (consumed by `capsule-core` for the
# escrow key wrap) and already pinned by the Argon2id row in design/cryptography/primitives.md,
# so this adds no crate and opens no new domain. It is the *server-side password verification*
# parameter set rather than the escrow KDF's tiered one — see `auth::credential` for why those
# are unrelated numbers. The Postgres adapter (#402) uses the same helper.
argon2 = { workspace = true }
# The OIDC relying party's egress: the discovery document, the JWK Set and the
# form-encoded token exchange, against the configured identity provider and nothing else. The
# one outbound HTTP client in this crate. Already in the lock file through `capsule-sdk`, so this
# promotes an edge rather than adding a crate. Redirects are off on every server egress client
# (this one and the federation pull worker's). rustls-tls only, like everywhere else Capsule
# holds a TLS stack.
reqwest = { workspace = true }
# The egress pull worker's client (`federation::pull::remote`, #1116) is generated by `build.rs`
# from the committed contract, and its embedded runtime names these two: `secrecy` for the
# credential it attaches, `http` because a `reqwest::Response` is constructible only from an
# `http::Response`, which is how the pull transport hands the generated code a body it has
# already bounded. Both are workspace pins already in the lock file through `capsule-sdk` (and
# `http` through reqwest and hyper), so nothing new enters the tree.
secrecy = { workspace = true }
http = { workspace = true }
# The `capsule-server` binary: subcommand parsing, and the error report a startup failure prints.
# `clap` and `color-eyre` were already here for the `gen_openapi` binary this replaces; the
# binary is now one `capsule-server` with `serve | gc | purge | scrub | gen-openapi`
# subcommands, for the reason `capsule-cli` is one binary — four executables would each carry
# their own copy of the config loader and the adapter seam.
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
# The Postgres adapters for the durable ports (#402). `default-features = false` is
# load-bearing rather than tidy: sea-orm's defaults include `with-chrono`, and
# `cargo xtask architecture-check` makes `cargo tree -p capsule-server -i chrono -e no-dev` a
# review-blocking gate: chrono may reach the lock file only through `capsule-server-migration`'s
# `sea-orm-migration`, a dev-dependency. Without a datetime feature
# there is no Rust binding for `TIMESTAMPTZ` at all, which is why every instant in the server's
# schema is a `BIGINT` of epoch microseconds converted in `postgres::time`.
#
# Three features and no more: `macros` for the `FromQueryResult` derive the adapters' private row
# structs use, `sqlx-postgres` for the driver, `runtime-tokio-rustls` because the workspace's TLS
# rule is rustls only.
#
# Not a workspace pin: this crate is sea-orm's one direct consumer (the CLI's SQLite left it for
# `rusqlite`), and a member may add features to an inherited dependency but may not turn the
# workspace's defaults **off**. Keep the version in step with the workspace `sea-orm-migration`
# pin, which pulls the same sea-orm.
sea-orm = { version = "2.0.4", default-features = false, features = [
  "macros",
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
# The log stream the binary installs (`cli::install_tracing`). `env-filter` for `RUST_LOG` and
# `json` for the one-object-per-event rendering a log shipper wants; both are on in the workspace
# pin. Written to **stderr**, so
# `gen-openapi` and the operator commands keep a parseable stdout.
tracing-subscriber = { workspace = true }

[build-dependencies]
# The server's own copy of the generated calls a federated pull makes (#1116): `build.rs` lowers
# the committed `openapi.json`, narrowed to the three operations a pull presents a capability
# to. The SDK's pin, with its defaults off for the SDK's reason, and a build-dependency only: the
# runtime is emitted into the generated module, so spargen never enters the served binary.
# `serde_json` reads the document's path list so the narrowing is computed, not hand-listed.
spargen = { version = "0.5.0", default-features = false }
serde_json = { workspace = true }

[dev-dependencies]
# The server's schema, applied by the Postgres conformance harness. A **dev-dependency only**,
# and that is the decision rather than an oversight: `sea-orm-migration` pulls sea-orm with its
# default `with-chrono` feature, so a normal dependency here would break the
# `cargo tree -i chrono -e no-dev` gate in `cargo xtask architecture-check`. The cost is that
# `serve` cannot migrate — it reads `seaql_migrations` and refuses to boot on a mismatch
# (`postgres::assert_schema_current`), which is also the safer rollout: a server that migrates on
# start migrates once per replica during a rolling deploy.
capsule-server-migration = { path = "migration" }
# The container the conformance suites run against: a Postgres for `postgres::testing`, behind
# `CAPSULE_TEST_POSTGRES=1`. The suites run the same cases the in-memory doubles pass, so
# `mise run test-rust` still needs no podman, and `.config/nextest.toml` puts them in the
# one-thread `containers` group.
#
# Both crates were pinned at the workspace and consumed by nothing — `xtask`'s
# `PLANNED_WORKSPACE_DEPENDENCIES` sanctioned them as planned because "no test starts a
# container yet". These are the tests that start one, so the two entries leave that list.
# Dev-only: the served binary links neither.
# `postgres`, the only module on the workspace pin, is the image `capsule-server/compose.yaml` runs.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

# Throwaway directories on disk. `tests/binary.rs` gives the spawned server a blob root of its
# own and deletes it afterwards; `tests/sdk_client.rs` puts a **real** `capsule_library::Workspace`
# there, because the only way to prove the upload ladder puts an asset on this server's feed is
# to push the ladder's own input — a hand-built bundle would agree with a wrong ladder.
# Already the workspace's scratch-directory crate (`capsule-core`, `capsule-sdk`,
# `capsule-core-ffi` all dev-depend on it) and already in the lock file.
tempfile = "3"

# The browser's share-open surface, driven natively by `tests/share.rs` (#614): a link issued
# through `POST /v1/shares` is served and then opened through the very entry points the viewer
# calls, so the serve shape and the wasm cannot drift apart unnoticed. A workspace member already
# in the lock file; off `wasm32` its `#[wasm_bindgen]` functions are plain Rust. Dev-only: the
# served binary links none of it.
capsule-wasm = { path = "../capsule-wasm" }

# `test-util` carries `kynos::test::TestClient`, which drives a built `Service` in-process —
# no socket, no port, no runtime flavour — and the two conformance assertions the suite is
# built around. `server` is on top of it for exactly one test: `tests/sdk_client.rs` binds the
# real router to an ephemeral port so the **SDK's own client** drives it over a socket, which
# is the one property an in-process client cannot prove. Dev-only either way: the assertions
# and the ephemeral listener belong to the tests, not to the served binary.
kynos = { workspace = true, features = ["test-util", "server"] }
# The SDK, as a *consumer* of this server. It depends on nothing here — its client is
# generated from `openapi.json`, a file — so this is acyclic, and it is what makes the
# generated client's round trip against the real router a test rather than a hope.
capsule-sdk = { path = "../capsule-sdk" }
# The client's local library, for the tests that push a **real** `Workspace`'s upload ladder at
# the router (`tests/sdk_client.rs`). Already in the graph through `capsule-sdk`; dev-only, so the
# key-free server never links a client library.
capsule-library = { path = "../capsule-library" }
# The SDK's persisted tokens are `SecretBox<str>`; a test that asserts a rotation happened has
# to look at them. Test-only, and the only place this crate touches the type.
secrecy = { workspace = true }
# `macros` and `rt-multi-thread` on top of what the blob store's adapter already needs: the
# `#[tokio::test]` attribute and a runtime to drive it. `net` for the in-process mock identity
# provider `tests/support/idp.rs` binds on loopback, so the OIDC relying party is exercised
# over a real socket. `test-util` for a paused clock, so the chunk read pace is proven over
# minutes of simulated trickle without waiting for them (`upload/body/tests.rs`). Test-only, so
# the served binary carries none of the four.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
# The TLS half of the mock identity provider, for the `OIDC_CA_BUNDLE` case: a private CA and
# a leaf it signs (`rcgen`), served by `tokio-rustls`, so "the relying party trusts the operator's
# CA and nothing else" is proven over a real handshake. The same three crates, versions and
# features `capsule-sdk` pins for the peering stack - `ring` provider throughout, matching the
# rustls `reqwest` links - so nothing new enters the lock file. Dev-only: the served binary
# terminates no TLS (design/networking.md#transport-security).
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The feed's manifest bytes arrive base64-encoded, and a test that asserts byte equality has to
# decode them. A normal dependency of the crate; listed here because the suite
# uses it directly.
base64 = { workspace = true }
# The suite builds its own authenticator from `capsule_server::auth::totp`'s exported constants
# and asks it for the code an app would be showing. That is deliberately a second construction
# rather than a helper on `TotpCodes`: a server has no business generating codes, and a test that
# reconstructs SHA-1/6 digits/30 seconds from the published constants is checking the interop
# contract every authenticator app assumes rather than trusting one function to agree with itself.
totp-rs = { workspace = true }
# Ed25519 key generation for the token tests: the suite mints a fresh key pair per signer
# rather than reading a checked-in PEM, because a private key in the repository is a private
# key somebody eventually reuses. `ring` is a normal dependency (the cursor MAC);
# it stays listed here only so the intent of the test usage is recorded.

