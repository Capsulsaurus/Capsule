[package]
name = "capsule-server-migration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The server's schema, as an operator binary and as a library the conformance harness applies.
#
# `capsule-server` takes this crate as a **dev-dependency only**, which is a deliberate
# constraint rather than an accident of layering: `sea-orm-migration` pulls `sea-orm` with its
# default features, `with-chrono` among them, and `cargo xtask architecture-check` makes
# `cargo tree -p capsule-server -i chrono -e no-dev` a review-blocking gate. Keeping the migrator
# out of the server's normal dependency graph is what keeps chrono off the server's path; this
# crate is the one place it is expected. The consequence is recorded where it is felt:
# `capsule_server::postgres::assert_schema_current` refuses to boot on a pending migration and
# names the command below, rather than running `Migrator::up` on `serve`.

[lib]
# Not `migration`: a name that generic invites a collision (the CLI once published a lib of that
# name), and two libs called `migration` in one workspace is a trap for `use migration::`.
name = "server_migration"
path = "src/lib.rs"

[[bin]]
name = "capsule-server-migration"
path = "src/main.rs"

[dependencies]
# The runtime `cli::run_cli` drives. Already the workspace's async runtime.
tokio = { workspace = true }
# The migrator itself, pinned at the workspace with `sqlx-postgres` and `runtime-tokio-rustls`
# — the server's schema is PostgreSQL's, and the TLS rule is rustls only. This crate opens no
# new dependency domain.
sea-orm-migration = { workspace = true }
# The per-migration content checksum (#524): SHA-256 of each migration's source, hex-encoded.
# Both are already workspace dependencies, so this opens no new dependency domain, and neither
# reaches `capsule-server`'s normal graph — the server compares the recorded hex against a
# compiled-in copy and hashes nothing itself.
sha2 = { workspace = true }
hex = { workspace = true }
