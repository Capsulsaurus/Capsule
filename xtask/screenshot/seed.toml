# Seed photos for the README hero screenshot (`mise run screenshot-ios`).
#
# Every photo is CC0 (Unsplash's pre-2017 licence, mirrored on Wikimedia Commons) and pinned by
# the SHA-256 of its original file; `xtask screenshot-seed` refuses bytes that do not match.
#
# Listed newest first, exactly as the Library timeline renders them: the first rows here are the
# first rows of the screenshot. Photos are grouped into capture days of 3 or 6 so every 3-column
# row is full. `day_offset` counts days before the run date (see `manifest.rs` for why dates are
# relative); `time` is local wall-clock time on that day.

