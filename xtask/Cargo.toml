[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# capsule-core (host, default features) seals the cross-language share-link KAT fixture
# (`share-kat`) with the exact issuer encapsulation the browser (`capsule-wasm`) reopens.
capsule-core = { path = "../capsule-core" }
base64 = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
regex = "1"
semver = "1"
serde = { workspace = true }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
uuid = { workspace = true }
# `screenshot-seed` / `screenshot-compose`: the README hero screenshot pipeline.
image = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Reads back the EXIF block `screenshot-seed` writes (already a capsule-core dependency).
kamadak-exif = "0.5"
tempfile = "3"
