[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# capsule-core (host, default features) seals the cross-language share-link KAT fixture
# (`share-kat`) with the exact issuer encapsulation the browser (`capsule-wasm`) reopens.
capsule-core = { path = "../capsule-core" }
# capsule-i18n owns the CLDR cardinal plural rules. The generator needs the same table the
# runtime selects with — which categories a language can select decides which
# `<item quantity=…>` arms Android may carry — and two copies of it in two crates is what
# `S-I7` found. The generator writes this crate's bundles; the committed output means there
# is no bootstrap problem, and the dependency is on hand-written code, not generated code.
capsule-i18n = { path = "../capsule-i18n" }
base64 = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
regex = "1"
semver = "1"
serde = { workspace = true }
serde_json = "1"
toml_edit = "0.22"
uuid = { workspace = true }
