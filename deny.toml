# cargo-deny — the machine check for Capsule's dependency-licence policy, and for the
# RustSec advisories, crate bans and crate sources of the same graph.
#
# The licence policy, and the reasoning behind every decision encoded in [licenses],
# lives in capsule-docs/src/content/docs/design/licensing.md. This file is the
# enforcement; that doc is the contract. Run it with `mise run license-check` (part of
# `check-rust`).
#
# The advisories, bans and sources checks run separately, as `mise run deny-check`, in
# CI's `rust-advisories` job. They stay out of `check-rust` because `check advisories`
# fetches the RustSec database over the network: the offline build keeps its
# deterministic licence gate, and CI fails on any advisory the database publishes.

[graph]
# Check every target Capsule ships for, not just the host. `tzf-rel` reaches the wasm
# bundle and `r-efi` only appears on UEFI/wasm targets, so a host-only graph would
# silently miss both.
all-features = true

[licenses]
# ALLOWLIST SEMANTICS: anything not listed here fails the build. GPL-*, LGPL-* and
# AGPL-* are therefore denied by omission, and that is deliberate rather than
# incidental — see "Forbidden" in the licensing doc. Capsule is itself AGPL, so a
# copyleft dependency is licence-*compatible* today; it is refused because a
# statically-linked copyleft component would forfeit app-store distribution, and no
# dependency bump should be able to make that decision on the copyright holder's
# behalf.
#
# Adding a licence here is a policy change: update the licensing doc first.
allow = [
    # Attribution-only. Obligations discharged by the root NOTICE.
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # File-level copyleft. MPL-2.0 S3.3 expressly permits distributing a larger work
    # under other terms; the obligation attaches to the MPL files themselves and is
    # discharged by linking them unmodified. Modifying one in-tree changes this.
    "MPL-2.0",
    # Apache-2.0 with the LLVM exception (rustix, wasi, the wit-bindgen family).
    # Strictly more permissive than bare Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
]

# Capsule's own crates are AGPL-3.0-only, which is correctly absent from the allowlist
# above — that entry governs what Capsule may *consume*. First-party crates are all
# `publish = false` and are skipped here so the outbound licence is never mistaken for
# an inbound one.
private = { ignore = true }

# Per-crate exceptions: a licence carrying an obligation beyond attribution, admitted
# because the obligation is bounded and Capsule discharges it in the root NOTICE.
# Each entry needs a matching NOTICE section. See "Permitted only as a named
# exception" in the licensing doc.
[[licenses.exceptions]]
# ODbL-1.0 is share-alike on the *database*, not on code that queries it. Capsule
# embeds the Timezone Boundary Builder shapefile unmodified via tzf-rs and creates no
# Derivative Database, so the obligation is attribution plus a pointer upstream.
# It is not feature-gated, so it reaches the CLI, the server, iOS, Android and wasm.
name = "tzf-rel"
allow = ["ODbL-1.0"]

[[licenses.exceptions]]
# `(MIT OR Apache-2.0) AND IJG`. Capsule elects MIT for the disjunctive part, but the
# IJG arm is conjunctive and cannot be elected away. It requires only a fixed notice.
name = "jpeg-encoder"
allow = ["IJG"]

[[licenses.exceptions]]
# `(MIT OR Apache-2.0) AND NCSA`. Capsule elects MIT for the disjunctive part, and the
# conjunctive NCSA arm is attribution-only (BSD-3-like). It is reached only through rav1e's
# `cfg(fuzzing)` target dependency, under capsule-core's `media-linked-codecs` feature (#437),
# so no Capsule artefact compiles it. It is listed because `[graph]` checks every target
# configuration. The NOTICE conjunctive section names it.
name = "libfuzzer-sys"
allow = ["NCSA"]

[advisories]
# Every RustSec advisory against the graph fails the build: vulnerabilities, unmaintained
# crates at any depth, and unsound ones. The remedy is a patched version in Cargo.lock.
# An entry below is admitted only where no patched version is reachable, and each names
# what blocks the fix and the issue that removes the entry. Deleting an entry once its
# blocker clears is how the gate proves the advisory gone.
unmaintained = "all"
ignore = [
    # openmls_libcrux_crypto 0.4.0, the latest release, pins libcrux-hmac-drbg to 0.0.1
    # (`"0.0.1"`) and hpke-rs-libcrux to 0.7, which pins libcrux-kem to `=0.0.9`. The fixes
    # (0.0.2, 0.0.10) are unreachable until a provider release admits them; all three are
    # panics on the client MLS path. Remove these entries in #646.
    { id = "RUSTSEC-2026-0329", reason = "libcrux-hmac-drbg 0.0.1: pinned by openmls_libcrux_crypto 0.4.0 (latest); tracked in #646" },
    { id = "RUSTSEC-2026-0330", reason = "libcrux-kem 0.0.9: pinned by hpke-rs-libcrux 0.7 via openmls_libcrux_crypto 0.4.0 (latest); tracked in #646" },
    { id = "RUSTSEC-2026-0331", reason = "libcrux-kem 0.0.9: pinned by hpke-rs-libcrux 0.7 via openmls_libcrux_crypto 0.4.0 (latest); tracked in #646" },

    # quick-xml 0.37.5 is required (`^0.37.5`) by little_exif 0.6.23, the latest release,
    # reached through rawshift-image's metadata path in capsule-core's `media` feature. Both
    # advisories are denial of service on a crafted document; the key-free server decodes
    # no media. Remove when little_exif moves past quick-xml 0.37.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via little_exif 0.6.23 (latest): no reachable fix; client-side DoS only" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via little_exif 0.6.23 (latest): no reachable fix; client-side DoS only" },

    # Unmaintained, no vulnerability. paste is a proc macro of little_exif and rav1e;
    # proc-macro-error2 is a proc macro of sea-orm 1.x's derive (sea-bae). Both run only at
    # compile time. Remove when those upstreams drop them.
    { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained proc macro) via little_exif and rav1e; compile-time only" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 (unmaintained proc macro) via sea-orm 1.x; compile-time only" },

    # Unmaintained, no vulnerability. basic-toml is the config parser inside askama_derive, a
    # proc macro reached through uniffi_bindgen (uniffi 0.31.1). askama_derive 0.16.1, the
    # latest release, still depends on it, so no uniffi upgrade drops it. It parses only
    # askama's build-time configuration. Remove when askama_derive replaces basic-toml.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml (unmaintained) via askama_derive (latest 0.16.1) via uniffi_bindgen; compile-time only" },
]

[bans]
# Duplicate versions are reported, not refused: the graph carries several (three rand)
# that only upstream releases can collapse.
multiple-versions = "warn"

[sources]
# Every crate comes from crates.io. A git dependency or another registry is a supply-chain
# decision that needs a reviewed entry here first.
unknown-registry = "deny"
unknown-git = "deny"
